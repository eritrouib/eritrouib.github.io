<style>
/* Layout: a full-screen block world; chunky outlined game cards float over it
   (title top-left, checklist right / bottom sheet on phones, controls bottom-left). */
:root {
  --ink: #22263a;
  --card: #ffffff;
  --sun: #ffce2e;
  --sky-top: #bfe3ff;
  --sky-bottom: #f3f9ff;
  --found: #22a35a;
  --muted: #5b6178;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Poppins", "Segoe UI", system-ui, sans-serif;
  --edge: 3px solid var(--ink);
  --pop: 0 5px 0 var(--ink);
  color-scheme: light;
}
[hidden] { display: none !important; }   /* keep hidden cards hidden: #card sets display: grid */
html, body { height: 100%; overflow: hidden; }
body { background: var(--sky-bottom); color: var(--ink); font-family: var(--body); font-size: 15px; }
#scene { position: fixed; inset: 0; background: linear-gradient(var(--sky-top), var(--sky-bottom)); touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; outline: none; }

.card { box-sizing: border-box; background: var(--card); border: var(--edge); border-radius: 18px; box-shadow: var(--pop); }
.display { font-family: var(--display); font-weight: 400; letter-spacing: 0.01em; }
.outlined { color: var(--sun); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--ink); }

#title {
  position: fixed; z-index: 2;
  top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  padding: 12px 18px 12px; max-width: min(420px, calc(100vw - 32px));
}
#title h1 { margin: 0; font-size: clamp(34px, 6vw, 54px); line-height: 1; text-wrap: balance; }
#title p { margin: 6px 0 0; font-weight: 500; color: var(--muted); line-height: 1.4; }

#panel {
  position: fixed; z-index: 2;
  top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: 330px; max-height: calc(100% - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; overflow: hidden;
}
#panel header { padding: 14px 18px 10px; display: grid; gap: 8px; }
#panel h2 { margin: 0; font-size: 28px; }
.progress { display: flex; align-items: center; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #eef1f7; }
.bar i { display: block; height: 100%; width: 0; background: var(--found); transition: width .4s; }
#list { list-style: none; margin: 0; padding: 4px 10px 10px; overflow-y: auto; display: grid; gap: 4px; }
#list button {
  width: 100%; display: grid; grid-template-columns: 34px 30px 1fr 30px; align-items: center; gap: 8px;
  padding: 7px 8px; border: 0; border-radius: 12px; background: transparent; color: var(--ink);
  font: 700 15px/1.2 var(--body); text-align: left; cursor: pointer;
}
#list button:hover { background: #eef4ff; }
#list button:focus-visible, .btn:focus-visible, #card button:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
.num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  border: 2px solid var(--ink); font-family: var(--display); font-size: 16px; }
.emo { font-size: 22px; line-height: 1; }
.tick { width: 26px; height: 26px; border: 3px solid var(--ink); border-radius: 7px; display: grid; place-items: center;
  font-size: 16px; color: #fff; }
li.found .tick { background: var(--found); }
li.found .label { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
#restart { margin: 0 18px 14px; align-self: start; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: var(--edge); border-radius: 14px;
  background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--ink); font: 700 14px/1 var(--body); cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn[aria-pressed="true"] { background: var(--sun); }
.btn.small { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }

#controls {
  position: fixed; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px;
  left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
#credit {
  position: fixed; z-index: 2; margin: 0; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.85);
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font-size: 11px; color: var(--muted);
}
#credit a { color: inherit; }

#tip {
  position: fixed; z-index: 3; pointer-events: none; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 10px;
  background: var(--card); font-weight: 700; font-size: 13px; line-height: 1.3; white-space: nowrap;
  transform: translate(-50%, calc(-100% - 14px));
}
#tip small { display: block; font-weight: 500; color: var(--muted); }

#card {
  position: fixed; z-index: 4; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(380px, calc(100vw - 32px)); padding: 22px 22px 18px; text-align: center; display: grid; gap: 10px; justify-items: center;
}
#card .big { font-size: 64px; line-height: 1; }
#card h3 { margin: 0; font-size: 30px; line-height: 1.05; }
#card .yay { margin: 0; font-family: var(--display); font-size: 20px; color: var(--found); }
#card p.fact { margin: 0; line-height: 1.5; max-width: 34ch; }
#card .ring { width: 96px; height: 96px; border-radius: 50%; border: 6px solid; display: grid; place-items: center; background: #fff; }

#win { position: fixed; z-index: 5; left: 50%; top: 18%; transform: translateX(-50%); padding: 16px 24px; text-align: center; }
#win h3 { margin: 0; font-size: clamp(30px, 6vw, 46px); }
#win p { margin: 4px 0 0; font-weight: 700; }
#confetti { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 1; font-family: var(--display); font-size: 28px; }

#sheetToggle { display: none; }
@media (max-width: 760px) {
  #title { padding: 10px 14px; max-width: calc(100vw - 100px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); }
  #card { bottom: calc(130px + env(safe-area-inset-bottom, 0px)); padding: 16px; gap: 6px; }
  #card .ring { width: 72px; height: 72px; }
  #card .big { font-size: 46px; }
  #card h3 { font-size: 24px; }
  #title p { font-size: 13px; }
  #panel {
    top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 55%;
  }
  #panel.collapsed #list, #panel.collapsed #restart { display: none; }
  #panel header { grid-template-columns: 1fr auto; align-items: center; }
  #panel h2 { font-size: 22px; }
  .progress { grid-column: 1 / -1; }
  #sheetToggle { display: inline-flex; }
  #controls { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); left: auto; right: max(16px, env(safe-area-inset-right, 0px));
    flex-direction: column; align-items: flex-end; }
  #controls .lbl { display: none; }
  #credit { bottom: auto; top: calc(10px + env(safe-area-inset-top, 0px) + 104px); right: auto; left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</aside>

</nav>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const W = JSON.parse(document.getElementById("world").textContent);
const dec = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const ground = dec(W.ground), height = dec(W.height), wallI = dec(W.wall), roofI = dec(W.roof);
const feat = dec(W.feat), kind = dec(W.kind);
const nameBytes = dec(W.name);
const nameI = new Uint16Array(nameBytes.buffer, 0, nameBytes.length / 2);
const NI = W.NI, NJ = W.NJ, N = NI * NJ;
const PL = 0.45;                         // height of one floor, in blocks
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const BADGE = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f59e0b"];
const WATER = W.groundClasses.indexOf("water"), POOL = W.groundClasses.indexOf("pool");

const X = (i) => i - NI / 2, Z = (j) => j - NJ / 2;
const srgb = (c, f = 1) => new THREE.Color().setRGB(c[0] / 255 * f, c[1] / 255 * f, c[2] / 255 * f, THREE.SRGBColorSpace);

// ---------------------------------------------------------------- scene
const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.32;
controls.minDistance = 12;
controls.maxDistance = 520;
controls.screenSpacePanning = false;
controls.autoRotateSpeed = 0.6;

scene.add(new THREE.HemisphereLight(0xdff1ff, 0x8a6a4a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-120, 220, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -175, right: 175, top: 175, bottom: -175, near: 10, far: 600 });
sun.shadow.bias = -0.0006;
scene.add(sun);

const box = new THREE.BoxGeometry(1, 1, 1);
const m4 = new THREE.Matrix4();
function instanced(count, opts = {}) {
  const mesh = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial(), count);
  mesh.castShadow = opts.cast ?? true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
function put(mesh, k, x, y, z, sx, sy, sz, color) {
  m4.makeScale(sx, sy, sz); m4.setPosition(x, y, z);
  mesh.setMatrixAt(k, m4); mesh.setColorAt(k, color);
}

// ground: one block per cell, water sits a little lower
const groundMesh = instanced(N, { cast: false });
const gcol = W.groundColours;
for (let j = 0, k = 0; j < NJ; j++) for (let i = 0; i < NI; i++, k++) {
  const g = ground[k], wet = g === WATER || g === POOL;
  const jitter = 0.95 + ((i * 73856093 ^ j * 19349663) >>> 0) % 1000 / 1000 * 0.09;
  const top = wet ? -0.14 : 0, h = 0.5;
  put(groundMesh, k, X(i) + 0.5, top - h / 2, Z(j) + 0.5, 0.97, h, 0.97, srgb(gcol[g], jitter));
}
// earth slab underneath
const slab = new THREE.Mesh(new THREE.BoxGeometry(NI + 0.4, 5, NJ + 0.4),
  [W.colours.dirt_dark, W.colours.dirt_dark, srgb([110, 160, 80]), W.colours.dirt, W.colours.dirt, W.colours.dirt]
    .map((c) => new THREE.MeshLambertMaterial({ color: Array.isArray(c) ? srgb(c) : c })));
slab.position.y = -0.5 - 2.5; slab.receiveShadow = true;
scene.add(slab);

// buildings: one box per floor so the blocks stack like bricks, with a roof cap
let floors = 0, nB = 0, nT = 0, nH = 0, nBr = 0;

const wallMesh = instanced(floors), roofMesh = instanced(nB);

for (let k = 0; k < N; k++) {
  const h = height[k]; if (!h) continue;
  const i = k % NI, j = (k / NI) | 0, x = X(i) + 0.5, z = Z(j) + 0.5;
  for (let f = 0; f < h; f++) put(wallMesh, fw++, x, f * PL + (PL - 0.05) / 2, z, 0.92, PL - 0.05, 0.92, f % 2 ? pal[wallI[k]] : palDim[wallI[k]]);
  put(roofMesh, fr++, x, h * PL + 0.04, z, 0.96, 0.14, 0.96, pal[roofI[k]]);
}
// trees, maze hedges and bridges
const trunkMesh = instanced(nT), leafMesh = instanced(nT), hedgeMesh = instanced(nH), bridgeMesh = instanced(nBr);
const leafA = srgb(W.colours.leaf), leafB = srgb(W.colours.leaf2), trunkC = srgb(W.colours.trunk);
const hedgeC = srgb(W.colours.hedge), bridgeC = srgb(W.colours.bridge);
let t = 0, hh = 0, bb = 0;
for (let k = 0; k < N; k++) {
  if (!feat[k]) continue;
  const i = k % NI, j = (k / NI) | 0, x = X(i) + 0.5, z = Z(j) + 0.5;
  if (feat[k] & 1) {
    put(trunkMesh, t, x, 0.35, z, 0.24, 0.7, 0.24, trunkC);
    const s = 0.72 + ((i * 31 + j * 17) % 5) * 0.05;
    put(leafMesh, t++, x, 0.7 + s * 0.6, z, s, s * 1.2, s, (i + j) % 3 ? leafA : leafB);
  }
  if (feat[k] & 2) put(hedgeMesh, hh++, x, 0.35, z, 0.95, 0.7, 0.95, hedgeC);
  if (feat[k] & 4) put(bridgeMesh, bb++, x, 0.2, z, 1, 0.2, 1, bridgeC);
}

// ---------------------------------------------------------------- markers
function badgeTexture(icon, color, n, done) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(20,30,60,.25)"; g.beginPath(); g.arc(128, 140, 104, 0, 7); g.fill();
  g.fillStyle = done ? "#22a35a" : color; g.beginPath(); g.arc(128, 128, 104, 0, 7); g.fill();
  g.lineWidth = 8; g.strokeStyle = "#22263a"; g.stroke();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(128, 128, 82, 0, 7); g.fill();
  g.font = "100px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle"; g.globalAlpha = done ? 0.55 : 1;
  g.fillText(icon, 128, 136); g.globalAlpha = 1;
  if (n) {
    g.fillStyle = done ? "#22a35a" : "#22263a"; g.beginPath(); g.arc(204, 52, 40, 0, 7); g.fill();
    g.lineWidth = 6; g.strokeStyle = "#fff"; g.stroke();
    g.fillStyle = "#fff"; g.font = done ? "700 54px Poppins, sans-serif" : "54px 'Lilita One', sans-serif";
    g.fillText(done ? "✓" : String(n), 204, 56);
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}
function topAt(i, j) {
  const k = (Math.floor(j) * NI + Math.floor(i));
  if (height[k]) return height[k] * PL + 0.1;
  if (feat[k] & 1) return 1.9;
  return 0;
}
const sprites = [];
const lineMat = new THREE.LineBasicMaterial({ color: 0x22263a });
function addMarker(p, big) {
  const top = topAt(p.i, p.j), lift = big ? 5.5 : 3;
  const mat = new THREE.SpriteMaterial({ map: badgeTexture(p.icon, BADGE[(p.n - 1) % 10] || "#fff", p.n, false),
    sizeAttenuation: false, depthTest: false, transparent: true });
  const s = new THREE.Sprite(mat);
  const x = X(p.i), z = Z(p.j);
  s.position.set(x, top + lift, z);
  s.scale.setScalar(big ? 0.085 : 0.05);
  s.renderOrder = big ? 10 : 9;
  s.userData = { p, big, baseY: top + lift, phase: Math.random() * 6 };
  scene.add(s); sprites.push(s);
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, top, z), new THREE.Vector3(x, top + lift, z)]);
  scene.add(new THREE.Line(geo, lineMat));
  return s;
}
const places = W.pois.slice().sort((a, b) => a.n - b.n);
const placeSprite = {};
places.forEach((p) => { placeSprite[p.n] = addMarker(p, true); });
W.extra.forEach((p) => addMarker(p, false));

// ---------------------------------------------------------------- checklist
let found = new Set();
try { found = new Set(JSON.parse(localStorage.getItem("kingston-found") || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem("kingston-found", JSON.stringify([...found])); } catch (e) {} };
const list = document.getElementById("list");
places.forEach((p) => {
  const li = document.createElement("li"); li.dataset.n = p.n;
  li.innerHTML = `<button type="button"><span class="num" style="background:${BADGE[(p.n - 1) % 10]}">${p.n}</span>
    <span class="emo" aria-hidden="true">${p.icon}</span><span class="label"></span><span class="tick" aria-hidden="true"></span></button>`;
  li.querySelector(".label").textContent = p.name;
  li.querySelector("button").addEventListener("click", () => { flyTo(p); openCard(p, false); });
  list.appendChild(li);
});
function refresh() {
  list.querySelectorAll("li").forEach((li) => {
    const done = found.has(+li.dataset.n);
    li.classList.toggle("found", done);
    li.querySelector(".tick").textContent = done ? "✓" : "";
    li.querySelector("button").setAttribute("aria-label", `${li.querySelector(".label").textContent}${done ? ", found" : ", not found yet"}`);
  });
  places.forEach((p) => {
    const s = placeSprite[p.n], done = found.has(p.n);
    if (s.userData.done !== done) { s.material.map.dispose(); s.material.map = badgeTexture(p.icon, BADGE[(p.n - 1) % 10], p.n, done); s.userData.done = done; }
  });
  document.getElementById("count").textContent = `${found.size} / ${places.length}`;
  document.getElementById("barFill").style.width = `${(found.size / places.length) * 100}%`;
}
refresh();

const card = document.getElementById("card");
function openCard(p, collect) {
  const fresh = collect && !found.has(p.n);
  if (collect) { found.add(p.n); save(); refresh(); }
  document.getElementById("cardIcon").textContent = p.icon;
  card.querySelector(".ring").style.borderColor = BADGE[(p.n - 1) % 10];
  document.getElementById("cardTitle").textContent = p.name;
  document.getElementById("cardFact").textContent = p.fact || "";
  const yay = document.getElementById("cardYay");
  yay.hidden = !found.has(p.n);
  yay.textContent = fresh ? `You found it! ${found.size} of ${places.length}` : "Found";
  card.hidden = false;
  document.getElementById("cardClose").focus({ preventScroll: true });
  if (fresh) burst(found.size === places.length ? 260 : 70);
  if (fresh && found.size === places.length) { document.getElementById("win").hidden = false; setTimeout(() => (document.getElementById("win").hidden = true), 6000); }
}
document.getElementById("cardClose").addEventListener("click", () => (card.hidden = true));
addEventListener("keydown", (e) => { if (e.key === "Escape") card.hidden = true; });
document.getElementById("restart").addEventListener("click", () => { found.clear(); save(); refresh(); card.hidden = true; });
const panel = document.getElementById("panel"), sheetBtn = document.getElementById("sheetToggle");
sheetBtn.addEventListener("click", () => {
  const c = panel.classList.toggle("collapsed");
  sheetBtn.textContent = c ? "Show list" : "Hide list"; sheetBtn.setAttribute("aria-expanded", String(!c));
});
if (matchMedia("(max-width: 760px)").matches) { panel.classList.add("collapsed"); sheetBtn.textContent = "Show list"; sheetBtn.setAttribute("aria-expanded", "false"); }

// ---------------------------------------------------------------- camera moves
const HOME = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
let anim = null;
function moveTo(pos, target, ms = 1100) {
  if (reduce) { camera.position.copy(pos); controls.target.copy(target); return; }
  anim = { t0: performance.now(), ms, p0: camera.position.clone(), q0: controls.target.clone(), p1: pos, q1: target };
}
function flyTo(p) {
  const target = new THREE.Vector3(X(p.i), 0, Z(p.j));
  const dir = camera.position.clone().sub(controls.target).normalize();
  dir.y = Math.max(dir.y, 0.55); dir.normalize();
  const flat = new THREE.Vector3(dir.x, 0, dir.z).normalize();
  const aim = target.clone().add(flat.multiplyScalar(9));      // look a little in front, so the place sits higher
  moveTo(aim.clone().add(dir.multiplyScalar(48)), aim);
}
document.getElementById("home").addEventListener("click", () => moveTo(HOME.pos.clone(), HOME.target.clone()));
const spinBtn = document.getElementById("spin");
spinBtn.addEventListener("click", () => {
  controls.autoRotate = !controls.autoRotate; spinBtn.setAttribute("aria-pressed", String(controls.autoRotate));
});

// ---------------------------------------------------------------- picking
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const tip = document.getElementById("tip");
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hitS = ray.intersectObjects(sprites, false)[0];
  if (hitS) return { sprite: hitS.object };
  const hit = ray.intersectObjects([roofMesh, wallMesh, groundMesh, leafMesh], false)[0];
  if (!hit) return null;
  const x = Math.floor(hit.point.x + NI / 2 + (hit.face?.normal.x ?? 0) * -0.01);
  const z = Math.floor(hit.point.z + NJ / 2 + (hit.face?.normal.z ?? 0) * -0.01);
  if (x < 0 || z < 0 || x >= NI || z >= NJ) return null;
  return { cell: z * NI + x };
}
function describe(k) {
  const nm = W.names[nameI[k]] || "";
  if (height[k]) {
    const kd = W.kinds[kind[k] - 1] || "Building", f = height[k];
    return [nm || kd, `${nm ? kd + " · " : ""}${f} floor${f > 1 ? "s" : ""}`];
  }
  const g = W.groundLabels[ground[k]];
  if (feat[k] & 2) return [nm || "The Maze", "Hedges"];
  if (feat[k] & 1) return [nm || "Tree", nm ? "Trees" : g];
  return [nm || g, nm && nm !== g ? g : ""];
}
function showTip(ev, info) {
  if (!info) { tip.hidden = true; return; }
  let head, sub;
  if (info.sprite) { const p = info.sprite.userData.p; head = p.name; sub = info.sprite.userData.big ? (found.has(p.n) ? "Found ✓" : "Tap to collect") : ""; }
  else [head, sub] = describe(info.cell);
  tip.innerHTML = ""; tip.append(head);
  if (sub) { const s = document.createElement("small"); s.textContent = sub; tip.append(s); }
  tip.style.left = `${ev.clientX}px`; tip.style.top = `${ev.clientY}px`; tip.hidden = false;
}
let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse" || e.buttons) { if (e.buttons) tip.hidden = true; return; }
  const info = pick(e);
  renderer.domElement.style.cursor = info?.sprite?.userData.big ? "pointer" : "";
  showTip(e, info);
});
renderer.domElement.addEventListener("pointerleave", () => (tip.hidden = true));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  const info = pick(e);
  if (info?.sprite?.userData.big) { tip.hidden = true; openCard(info.sprite.userData.p, true); flyTo(info.sprite.userData.p); return; }
  if (e.pointerType !== "mouse") showTip(e, info);
});

// ---------------------------------------------------------------- confetti
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let bits = [];
function burst(n) {
  if (reduce) return;
  for (let k = 0; k < n; k++) bits.push({ x: innerWidth / 2, y: innerHeight * 0.42, vx: (Math.random() - 0.5) * 16,
    vy: -Math.random() * 14 - 4, r: Math.random() * 6.3, s: 6 + Math.random() * 8, c: BADGE[k % 10], life: 140 });
}
function drawConfetti() {
  if (!bits.length) { cx.clearRect(0, 0, cv.width, cv.height); return; }
  cv.width = innerWidth; cv.height = innerHeight;
  bits = bits.filter((b) => b.life-- > 0 && b.y < innerHeight + 40);
  for (const b of bits) {
    b.vy += 0.42; b.x += b.vx; b.y += b.vy; b.vx *= 0.99; b.r += 0.15;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore();
  }
}

// ---------------------------------------------------------------- loop
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  // wide screens: aim east of centre so the town clears the checklist; phones: pull back to fit
  const narrow = w / h < 0.8;
  // phones look along the island's long side, from the east, so it runs down the screen
  HOME.target.set(narrow ? -10 : 34, 0, narrow ? 0 : 14);
  if (narrow) HOME.pos.set(375, 370, 80).add(HOME.target);
  else HOME.pos.set(150, 175, 205).multiplyScalar(1.08).add(HOME.target);
  // markers keep a steady size on screen, smaller on narrow screens
  const k = Math.min(1, (w / h) * 1.15);
  for (const s of sprites) s.scale.setScalar((s.userData.big ? 0.085 : 0.05) * k);
}
addEventListener("resize", resize);
resize();
camera.position.copy(HOME.pos); controls.target.copy(HOME.target);
document.getElementById("loading").remove();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const now = performance.now(), t = clock.getElapsedTime();
  if (anim) {
    const u = Math.min(1, (now - anim.t0) / anim.ms), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.q0, anim.q1, e);
    if (u >= 1) anim = null;
  }
  if (!reduce) for (const s of sprites) s.position.y = s.userData.baseY + Math.sin(t * 2 + s.userData.phase) * (s.userData.big ? 0.5 : 0.25);
  controls.update();
  renderer.render(scene, camera);
  drawConfetti();
});
</script>
