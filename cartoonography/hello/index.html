<style>
/* A full-screen map with chunky game cards floating over it: title and modes top-left,
   passport right (a bottom sheet on phones), zoom buttons bottom-left, the hello card bottom-centre. */
:root {
  --ink: #22263a; --card: #fff; --sun: #FFCE2E; --muted: #5b6178; --found: #22a35a;
  --sea: #CDEBFA; --land: #FBE3B8; --paper: #FFF7E8;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Poppins", "Segoe UI", system-ui, sans-serif;
  --script: "Noto Sans", "Noto Naskh Arabic", "Noto Sans Devanagari", "Noto Sans Gurmukhi", "Noto Sans Bengali",
            "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", "Noto Sans Ethiopic", system-ui, sans-serif;
  --edge: 3px solid var(--ink); --pop: 0 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font: 500 15px/1.4 var(--body); }
button { font: inherit; color: inherit; }

#stage { position: fixed; inset: 0; touch-action: manipulation; background: var(--sea); }
#map { width: 100%; height: 100%; display: block; }
#map .country { fill: var(--land); stroke: #fff; stroke-width: .6; stroke-linejoin: round; transition: fill .3s; }
#map .country.lit { fill: var(--lit, #ffd27a); }
.marker { cursor: pointer; }
.marker circle.dot { stroke: #fff; transition: r .2s; }
.marker circle.halo { fill: transparent; }
.marker .got { fill: #fff; font: 700 1px var(--body); pointer-events: none; }
.marker text.word { font-family: var(--script); font-weight: 800; paint-order: stroke; stroke: #fff; stroke-linejoin: round; pointer-events: none; }
.marker.shake { animation: shake .45s; }
.marker.pulse circle.dot { animation: pulse 1s ease-in-out infinite; }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
@keyframes pulse { 50% { opacity: .35 } }
.marker:focus { outline: none; }
.marker:focus-visible circle.dot { stroke: var(--ink); }

.panel { position: fixed; z-index: 2; background: var(--card); border: var(--edge); border-radius: 18px; box-shadow: var(--pop); }
.display { font-family: var(--display); font-weight: 400; letter-spacing: .01em; }
.outlined { color: var(--sun); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--ink); }

#title { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 12px 16px 14px; width: min(400px, calc(100vw - 32px)); }
#title h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); line-height: 1; }
#title p { margin: 6px 0 10px; color: var(--muted); }
.tabs { display: inline-flex; border: var(--edge); border-radius: 14px; overflow: hidden; }
.tabs button { border: 0; background: #fff; padding: 8px 16px; font-weight: 700; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--sun); }
.tabs button + button { border-left: var(--edge); }

#passport { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 300px;
  max-height: calc(100% - 110px); display: flex; flex-direction: column; overflow: hidden; }
#passport header { padding: 12px 16px 8px; display: grid; gap: 6px; grid-template-columns: 1fr auto; align-items: center; }
#passport h2 { margin: 0; font-size: 26px; }
.progress { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #eef1f7; }
.bar i { display: block; height: 100%; width: 0; background: var(--found); transition: width .4s; }
#stamps { list-style: none; margin: 0; padding: 6px 12px 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
#stamps button { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px dashed var(--c); background: #fff; cursor: pointer;
  display: grid; place-content: center; text-align: center; padding: 4px; line-height: 1.1; transition: transform .15s; }
#stamps button:hover { transform: rotate(-4deg) scale(1.04); }
#stamps .w { font-family: var(--script); font-weight: 800; font-size: 15px; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stamps .l { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
#stamps li.got button { border-style: solid; background: var(--c); color: #fff; transform: rotate(-6deg); }
#stamps li.got .l { color: #fff; }
#restart { margin: 0 16px 12px; justify-self: start; }
#sheetToggle { display: none; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: var(--edge); border-radius: 14px; background: #fff;
  box-shadow: 0 4px 0 var(--ink); font-weight: 700; cursor: pointer; line-height: 1; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn[aria-pressed="true"], .btn.primary { background: var(--sun); }
.btn.small { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
button:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }

#zoom { position: fixed; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px; }
#credit { position: fixed; z-index: 1; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.85); font-size: 11px; color: var(--muted); }
#credit a { color: inherit; }

#card { left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4;
  width: min(400px, calc(100vw - 24px)); padding: 18px 20px 16px; display: grid; gap: 6px; justify-items: center; text-align: center; border-color: var(--c); box-shadow: 0 6px 0 var(--c); }
#card .lang { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--c); font-size: 14px; }
#card .hello { font-family: var(--script); font-weight: 800; font-size: clamp(40px, 9vw, 58px); line-height: 1.15; }
#card .latin { font-weight: 700; margin-top: -4px; }
#card .say { color: var(--muted); }
#card .say b { color: var(--ink); }
#card .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 4px 0; }
#card .fact { margin: 2px 0 0; max-width: 36ch; line-height: 1.5; }
#card .meta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 12px; }
.chip { border: 2px solid var(--c, var(--ink)); border-radius: 99px; padding: 2px 10px; font-weight: 700; }
#card .close { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; cursor: pointer; font-weight: 700; }
#voiceNote { font-size: 12px; color: var(--muted); margin: 0; max-width: 34ch; }

#quiz { left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 3; padding: 10px 18px 12px; text-align: center; width: min(380px, calc(100vw - 24px)); }
#quiz .q { font-weight: 700; color: var(--muted); }
#quiz .hello { font-family: var(--script); font-weight: 800; font-size: 40px; line-height: 1.2; }
#quiz .status { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; margin-top: 6px; }
#quiz .hint { min-height: 1.4em; margin: 4px 0 0; font-weight: 700; }
#quiz .hint.good { color: var(--found); }
#quiz .hint.bad { color: #c2410c; }

#done { left: 50%; top: 22%; transform: translateX(-50%); z-index: 5; padding: 18px 26px; text-align: center; width: min(380px, calc(100vw - 24px)); }
#done h3 { margin: 0; font-size: clamp(30px, 6vw, 42px); }
#done p { margin: 6px 0 12px; font-weight: 700; }
#confetti { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
#tip { position: fixed; z-index: 3; pointer-events: none; padding: 5px 9px; border: 2px solid var(--ink); border-radius: 10px; background: #fff;
  font-weight: 700; font-size: 13px; transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; }

@media (max-width: 1100px) and (min-width: 761px) { #passport { width: 250px; } #stamps { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) {
  body { font-size: 14px; }
  #title { padding: 10px 12px 12px; }
  #title p { font-size: 13px; margin: 4px 0 8px; }
  #passport { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    width: auto; max-height: 52%; }
  #passport.collapsed #stamps, #passport.collapsed #restart { display: none; }
  #passport h2 { font-size: 21px; }
  #sheetToggle { display: inline-flex; }
  #stamps { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
  #zoom { bottom: auto; top: calc(178px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); }
  #zoom .btn { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
  #credit { bottom: auto; top: calc(226px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: auto; font-size: 10px; }
  #card { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 14px 14px 12px; }
  #quiz { top: auto; bottom: calc(116px + env(safe-area-inset-bottom, 0px)); }
  body.quizzing #title { display: none; }
  body.quizzing #zoom { top: calc(14px + env(safe-area-inset-top, 0px)); }
  body.quizzing #credit { top: calc(62px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .bar i, #map .country { transition: none; } .marker.pulse circle.dot, .marker.shake { animation: none; } }
</style>

<div id="stage"><svg id="map" role="img" aria-label="World map with places where people say hello in 26 languages"></svg></div>

<section id="title" class="panel">
  <h1 class="display outlined">Say hello!</h1>
  <p id="intro">Tap a dot to hear hello, say it out loud, and collect a stamp in your passport.</p>
  <div class="tabs" role="group" aria-label="Mode">
    <button type="button" id="modeExplore" aria-pressed="true">🗺️ Explore</button>
    <button type="button" id="modeQuiz" aria-pressed="false">❓ Quiz</button>
  </div>
</section>

<aside id="passport" class="panel" aria-label="My passport">
  <header>
    <h2 class="display outlined">My passport</h2>
    <button id="sheetToggle" class="btn small" type="button" aria-expanded="true" aria-controls="stamps">Hide</button>
    <div class="progress"><div class="bar" aria-hidden="true"><i id="barFill"></i></div><span id="count">0 / 26</span></div>
  </header>
  <ul id="stamps"></ul>
  <button id="restart" class="btn small" type="button">Start again</button>
</aside>

<nav id="zoom" aria-label="Zoom to"></nav>
<p id="credit">Map: Natural Earth · <a href="../">@ET · etymo.co.uk</a></p>

<div id="card" class="panel" role="dialog" aria-labelledby="cardHello" hidden>
  <button class="close" type="button" id="cardClose" aria-label="Close">✕</button>
  <div class="lang" id="cardLang"></div>
  <div class="hello" id="cardHello"></div>
  <div class="latin" id="cardLatin"></div>
  <div class="say">say: <b id="cardSay"></b></div>
  <div class="row">
    <button class="btn" type="button" id="hear">🔊 Hear it</button>
    <button class="btn primary" type="button" id="said">🗣️ I said it!</button>
  </div>
  <p id="voiceNote" hidden></p>
  <p class="fact" id="cardFact"></p>
  <div class="meta"><span class="chip" id="cardWhere"></span><span class="chip" id="cardScript"></span></div>
</div>

<div id="quiz" class="panel" hidden>
  <div class="q">Where do people say…</div>
  <div class="hello" id="quizHello"></div>
  <div class="row" style="display:flex;justify-content:center;gap:8px"><button class="btn small" type="button" id="quizHear">🔊 Hear it</button><button class="btn small" type="button" id="quizSkip">Skip ⏭</button></div>
  <p class="hint" id="quizHint" aria-live="polite"></p>
  <div class="status"><span id="quizNum"></span><span id="quizScore"></span></div>
</div>

<div id="done" class="panel" hidden>
  <h3 class="display outlined" id="doneTitle"></h3>
  <p id="doneText"></p>
  <button class="btn primary" type="button" id="doneBtn">Play again</button>
</div>
<div id="tip" hidden></div>
<canvas id="confetti"></canvas>

,"say":"noh-mosh-KAR","where":"Bangladesh and India","lon":90.4,"lat":23.7,"script":"Indic","voice":"bn-BD","fact":"The national anthems of both India and Bangladesh were written in Bengali, by the same poet: Rabindranath Tagore.","x":745.6,"y":157.0,"region":"Asia","countries":["BGD"],"color":"#F2711C"},{"id":"zh","language":"Mandarin","hello":"你好","latin":"Nǐ hǎo","say":"nee HOW","where":"China","lon":104.2,"lat":35.9,"script":"Chinese and Japanese","voice":"zh-CN","fact":"More people speak Mandarin as their first language than any other language.","x":768.0,"y":114.0,"region":"Asia","countries":["CHN"],"color":"#E23B3B"},{"id":"ja","language":"Japanese","hello":"こんにちは","latin":"Konnichiwa","say":"kon-nee-chee-wah","where":"Japan","lon":138.3,"lat":36.2,"script":"Chinese and Japanese","voice":"ja-JP","fact":"Japanese mixes three kinds of writing in one sentence: hiragana, katakana and kanji.","x":855.1,"y":113.0,"region":"Asia","countries":["JPN"],"color":"#E23B3B"},{"id":"ko","language":"Korean","hello":"안녕하세요","latin":"Annyeonghaseyo","say":"ahn-nyong-ha-SAY-yo","where":"South Korea","lon":127.8,"lat":36.5,"script":"Korean","voice":"ko-KR","fact":"The Korean alphabet, Hangul, was invented on purpose in the 1440s so that everyone could learn to read.","x":827.6,"y":112.0,"region":"Asia","countries":["KOR"],"color":"#E0479E"},{"id":"sw","language":"Swahili","hello":"Habari!","say":"ha-BAR-ee","where":"Kenya and Tanzania","lon":36.0,"lat":-3.0,"script":"Latin","voice":"sw-KE","fact":"Habari means 'news'. You're really asking: what's new?","x":601.8,"y":257.1,"region":"Africa","countries":["KEN","TZA"],"color":"#2F6FE4"},{"id":"zu","language":"Zulu","hello":"Sawubona","say":"sah-woo-BOH-nah","where":"South Africa","lon":30.5,"lat":-28.5,"script":"Latin","voice":"zu-ZA","fact":"Sawubona means 'I see you'.","x":581.3,"y":351.6,"region":"Africa","countries":["ZAF"],"color":"#2F6FE4"},{"id":"am","language":"Amharic","hello":"ሰላም","latin":"Selam","say":"seh-LAHM","where":"Ethiopia","lon":39.6,"lat":9.1,"script":"Ethiopic","voice":"am-ET","fact":"Amharic has its own script, Ge'ez, where each symbol stands for a whole syllable.","x":611.4,"y":211.2,"region":"Africa","countries":["ETH"],"color":"#C99A06"},{"id":"mi","language":"Māori","hello":"Kia ora","say":"kee-uh OR-ah","where":"New Zealand","lon":174.0,"lat":-40.5,"script":"Latin","voice":"mi-NZ","fact":"Kia ora means 'be well'. People also use it to say thank you.","x":935.5,"y":392.7,"region":"Oceania","countries":["NZL"],"color":"#2F6FE4"}],"scripts":{"Latin":{"color":"#2F6FE4","sample":"A B C","label":"Latin alphabet"},"Greek":{"color":"#0EA5C6","sample":"Α Β Γ","label":"Greek alphabet"},"Cyrillic":{"color":"#7C4DDB","sample":"А Б В","label":"Cyrillic alphabet"},"Arabic":{"color":"#1E9E57","sample":"ا ب ت","label":"Arabic script"},"Indic":{"color":"#F2711C","sample":"क ਕ ক","label":"Scripts from India"},"Chinese and Japanese":{"color":"#E23B3B","sample":"字 か","label":"Chinese characters and Japanese kana"},"Korean":{"color":"#E0479E","sample":"한 글","label":"Korean Hangul"},"Ethiopic":{"color":"#C99A06","sample":"ሀ ለ ሐ","label":"Ge'ez script"}},"regions":{"World":[0,0,1000,438.6],"Europe":[447.8,12.3,216.8,125.3],"Asia":[633.2,62.0,271.9,149.4],"Africa":[531.3,95.9,130.1,305.7]}}</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const L = D.langs, W = D.world, SVGNS = "http://www.w3.org/2000/svg";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let quiz = null;   // the quiz state while a quiz is running
const byId = Object.fromEntries(L.map((l) => [l.id, l]));
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ------------------------------------------------------------ map
const svg = $("map");
el("path", { d: W.sea, fill: "#CDEBFA" }, svg);
const countryG = el("g", {}, svg);
const countryEls = {};
for (const c of W.countries) { const p = el("path", { d: c.d, class: "country" }, countryG); (countryEls[c.iso] ||= []).push(p); }
const markG = el("g", {}, svg);
const marks = {};
const LEFT = new Set(["ur", "ga", "ko", "sq", "fr"]);   // labels that go left of the dot, so neighbours don't overlap
for (const l of L) {
  const g = el("g", { class: "marker", tabindex: 0, role: "button", "aria-label": `${l.language}` }, markG);
  g.dataset.id = l.id;
  el("circle", { class: "halo", cx: l.x, cy: l.y, r: 10 }, g);
  el("circle", { class: "dot", cx: l.x, cy: l.y, r: 5, fill: l.color, "stroke-width": 1.5 }, g);
  const got = el("text", { class: "got", x: l.x, y: l.y, "text-anchor": "middle", "dominant-baseline": "central" }, g); got.textContent = "✓";
  const word = el("text", { class: "word", x: l.x + 8, y: l.y, "dominant-baseline": "central", fill: l.color }, g);
  word.textContent = l.hello; if (l.script === "Arabic") word.setAttribute("direction", "rtl");
  marks[l.id] = g;
}

// viewBox animation between World and the regions; markers keep a steady size on screen
let vb = D.regions.World.slice(), region = "World", vbAnim = null;
function sizeMarkers() {
  const k = vb[2] / Math.max(svg.clientWidth, 1) * (svg.clientWidth <= 760 ? 1.05 : 1.25);   // map units per screen pixel
  const showWords = region !== "World" && !quiz;   // in the quiz the words would give the answer away
  for (const l of L) {
    const g = marks[l.id], [halo, dot, got, word] = g.children;
    halo.setAttribute("r", 13 * k); dot.setAttribute("r", 6.5 * k); dot.setAttribute("stroke-width", 1.8 * k);
    got.style.fontSize = 8 * k + "px";
    word.style.display = showWords ? "" : "none";
    word.style.fontSize = 11 * k + "px"; word.setAttribute("stroke-width", 3 * k);
    const left = LEFT.has(l.id), rtl = l.script === "Arabic";
    word.setAttribute("x", l.x + (left ? -9 : 9) * k);
    // right-to-left words swap what "start" and "end" mean
    word.setAttribute("text-anchor", left !== rtl ? "end" : "start");
  }
}
// fit a box of the map into the part of the screen the panels leave free
function fit(box) {
  const sw = svg.clientWidth || innerWidth, sh = svg.clientHeight || innerHeight, phone = sw <= 760;
  const pad = { l: 16, r: phone ? 16 : $("passport").offsetWidth + 40, t: 16, b: 76 };
  if (phone) {   // keep clear of the cards stacked at the top and bottom of a phone screen
    const vis = (id) => { const e = $(id); return e && !e.hidden && getComputedStyle(e).display !== "none" ? e.getBoundingClientRect() : null; };
    const top = ["title", "zoom", "credit"].map(vis).filter(Boolean), bottom = ["passport", "quiz"].map(vis).filter(Boolean);
    pad.t = Math.max(16, ...top.filter((r) => r.top < sh / 2).map((r) => r.bottom + 10));
    pad.b = Math.max(16, ...bottom.filter((r) => r.top > sh / 2).map((r) => sh - r.top + 10));
  }
  const fw = Math.max(sw - pad.l - pad.r, 100), fh = Math.max(sh - pad.t - pad.b, 100);
  const s = Math.min(fw / box[2], fh / box[3]);
  const cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
  const fx = pad.l + fw / 2, fy = pad.t + fh / 2;          // centre of the free area, in screen pixels
  return [cx - fx / s, cy - fy / s, sw / s, sh / s];
}
function setVB(v) { vb = v; svg.setAttribute("viewBox", v.map((n) => n.toFixed(1)).join(" ")); sizeMarkers(); }
function zoomTo(name) {
  region = name;
  document.querySelectorAll("#zoom .btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.r === name)));
  const target = fit(D.regions[name]);
  if (reduce) return setVB(target);
  vbAnim = { t0: performance.now(), from: vb.slice(), to: target };
  requestAnimationFrame(stepVB);
}
function stepVB(now) {
  if (!vbAnim) return;
  const u = Math.min(1, (now - vbAnim.t0) / 700), e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  setVB(vbAnim.from.map((a, i) => a + (vbAnim.to[i] - a) * e));
  if (u < 1) requestAnimationFrame(stepVB); else vbAnim = null;
}
const zoomNames = { World: "🌍 World", Europe: "Europe", Asia: "Asia", Africa: "Africa" };
for (const r of Object.keys(zoomNames)) {
  const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.dataset.r = r; b.textContent = zoomNames[r];
  b.setAttribute("aria-pressed", String(r === "World")); b.addEventListener("click", () => zoomTo(r)); $("zoom").appendChild(b);
}
svg.setAttribute("preserveAspectRatio", "xMinYMin meet");
setVB(fit(D.regions.World));
addEventListener("resize", () => { vbAnim = null; setVB(fit(D.regions[region])); });

// ------------------------------------------------------------ speech
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch (e) { voices = []; } };
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.addEventListener?.("voiceschanged", loadVoices); }
function voiceFor(l) {
  const want = l.voice.toLowerCase(), base = want.split("-")[0];
  return voices.find((v) => v.lang.toLowerCase().replace("_", "-") === want) || voices.find((v) => v.lang.toLowerCase().startsWith(base));
}
function speak(l, note) {
  if (!("speechSynthesis" in window)) { if (note) showNote(`This browser can't speak. Try the "say" line instead!`); return; }
  loadVoices();
  const v = voiceFor(l);
  if (!v) { if (note) showNote(`This device doesn't have a ${l.language} voice. Try the "say" line instead, or ask someone who speaks ${l.language}!`); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(l.hello.replace(/[¡!]/g, ""));
  u.voice = v; u.lang = v.lang; u.rate = 0.8;
  speechSynthesis.speak(u);
}
function showNote(t) { const n = $("voiceNote"); n.textContent = t; n.hidden = false; }

// ------------------------------------------------------------ passport
let got = new Set();
try { got = new Set(JSON.parse(localStorage.getItem("hello-stamps") || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem("hello-stamps", JSON.stringify([...got])); } catch (e) {} };
for (const l of L) {
  const li = document.createElement("li"); li.dataset.id = l.id;
  li.innerHTML = `<button type="button" style="--c:${l.color}"><span class="w"></span><span class="l"></span></button>`;
  li.querySelector(".w").textContent = l.hello; li.querySelector(".l").textContent = l.language;
  li.querySelector("button").addEventListener("click", () => { if (!quiz) { zoomTo(l.region in D.regions ? l.region : "World"); openCard(l); } });
  $("stamps").appendChild(li);
}
function refresh() {
  document.querySelectorAll("#stamps li").forEach((li) => {
    const l = byId[li.dataset.id], has = got.has(l.id);
    li.classList.toggle("got", has);
    li.querySelector("button").setAttribute("aria-label", `${l.language}: ${l.hello}${has ? ", stamp collected" : ""}`);
  });
  for (const l of L) marks[l.id].children[2].style.display = got.has(l.id) ? "" : "none";
  $("count").textContent = `${got.size} / ${L.length}`;
  $("barFill").style.width = `${got.size / L.length * 100}%`;
}
refresh();
$("restart").addEventListener("click", () => { got.clear(); save(); refresh(); });
const passport = $("passport"), sheetBtn = $("sheetToggle");
sheetBtn.addEventListener("click", () => {
  const c = passport.classList.toggle("collapsed"); sheetBtn.textContent = c ? "Show" : "Hide"; sheetBtn.setAttribute("aria-expanded", String(!c));
  if (c) setVB(fit(D.regions[region]));
});
if (matchMedia("(max-width: 760px)").matches) { passport.classList.add("collapsed"); sheetBtn.textContent = "Show"; sheetBtn.setAttribute("aria-expanded", "false"); }

// ------------------------------------------------------------ the hello card
let current = null;
function light(l) {
  document.querySelectorAll(".country.lit").forEach((p) => p.classList.remove("lit"));
  if (!l) return;
  for (const iso of l.countries) for (const p of countryEls[iso] || []) { p.classList.add("lit"); p.style.setProperty("--lit", l.color + "55"); }
}
function openCard(l) {
  current = l;
  const card = $("card");
  card.style.setProperty("--c", l.color);
  $("cardLang").textContent = l.language;
  $("cardHello").textContent = l.hello; $("cardHello").dir = l.script === "Arabic" ? "rtl" : "ltr";
  $("cardLatin").textContent = l.latin || ""; $("cardLatin").hidden = !l.latin;
  $("cardSay").textContent = l.say;
  $("cardFact").textContent = l.fact;
  $("cardWhere").textContent = "📍 " + l.where;
  const sc = D.scripts[l.script]; $("cardScript").textContent = `✍️ ${sc.label}`; $("cardScript").style.setProperty("--c", sc.color);
  $("voiceNote").hidden = true;
  $("said").disabled = got.has(l.id); $("said").textContent = got.has(l.id) ? "✅ Stamp collected" : "🗣️ I said it!";
  card.hidden = false;
  if (matchMedia("(max-width: 760px)").matches) { passport.classList.add("collapsed"); sheetBtn.textContent = "Show"; }
  light(l);
  $("hear").focus({ preventScroll: true });
}
function closeCard() { $("card").hidden = true; light(null); current = null; }
$("cardClose").addEventListener("click", closeCard);
addEventListener("keydown", (e) => { if (e.key === "Escape") closeCard(); });
$("hear").addEventListener("click", () => current && speak(current, true));
$("said").addEventListener("click", () => {
  if (!current || got.has(current.id)) return;
  got.add(current.id); save(); refresh();
  $("said").disabled = true; $("said").textContent = "✅ Stamp collected";
  burst(got.size === L.length ? 260 : 60);
  if (got.size === L.length) showDone("Passport full!", `You said hello in all ${L.length} languages. Amazing!`, "Keep exploring");
});

// ------------------------------------------------------------ quiz
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setMode(q) {
  $("modeExplore").setAttribute("aria-pressed", String(!q)); $("modeQuiz").setAttribute("aria-pressed", String(q));
  document.body.classList.toggle("quizzing", q);
  closeCard();
  if (q) { quiz = { order: shuffle(L.slice()).slice(0, 10), i: 0, score: 0, tries: 0 }; $("quiz").hidden = false; ask(); $("intro").textContent = "Read the hello, then tap the place where people say it."; }
  else { quiz = null; $("quiz").hidden = true; clearPulse(); $("intro").textContent = "Tap a dot to hear hello, say it out loud, and collect a stamp in your passport."; }
  vbAnim = null; setVB(fit(D.regions[region]));
}
function clearPulse() { document.querySelectorAll(".marker.pulse").forEach((m) => m.classList.remove("pulse")); }
function ask() {
  clearPulse();
  const l = quiz.order[quiz.i]; quiz.tries = 0;
  $("quizHello").textContent = l.hello; $("quizHello").dir = l.script === "Arabic" ? "rtl" : "ltr";
  $("quizHint").textContent = l.latin ? `(${l.latin})` : ""; $("quizHint").className = "hint";
  $("quizNum").textContent = `Question ${quiz.i + 1} of ${quiz.order.length}`;
  $("quizScore").textContent = `⭐ ${quiz.score}`;
}
function next() {
  quiz.i++;
  if (quiz.i >= quiz.order.length) {
    const s = quiz.score, n = quiz.order.length;
    burst(s >= n * 0.7 ? 220 : 60);
    showDone(s === n ? "Perfect score!" : s >= n * 0.7 ? "Brilliant!" : "Good try!", `You got ${s} out of ${n}. Every hello you know is a new friend you can make.`, "Play again");
    return;
  }
  ask();
}
function answer(id) {
  const l = quiz.order[quiz.i];
  if (id === l.id) {
    quiz.score += quiz.tries === 0 ? 1 : 0;
    $("quizHint").textContent = `Yes! ${l.hello} is ${l.language}.`; $("quizHint").className = "hint good";
    $("quizScore").textContent = `⭐ ${quiz.score}`;
    light(l); burst(40);
    setTimeout(() => { light(null); next(); }, 1500);
  } else {
    quiz.tries++;
    const m = marks[id]; m.classList.remove("shake"); void m.getBBox(); m.classList.add("shake");
    const hint = quiz.tries === 1 ? `Not quite! It's in ${l.region}.` : `Look for the flashing dot!`;
    $("quizHint").textContent = hint; $("quizHint").className = "hint bad";
    if (quiz.tries === 1) { const r = D.regions[l.region] ? l.region : "World"; if (r !== region) zoomTo(r); }
    if (quiz.tries >= 2) marks[l.id].classList.add("pulse");
  }
}
$("modeExplore").addEventListener("click", () => setMode(false));
$("modeQuiz").addEventListener("click", () => setMode(true));
$("quizHear").addEventListener("click", () => quiz && speak(quiz.order[quiz.i], false));
$("quizSkip").addEventListener("click", () => quiz && next());
function showDone(title, text, btn) {
  $("doneTitle").textContent = title; $("doneText").textContent = text; $("doneBtn").textContent = btn; $("done").hidden = false;
  $("doneBtn").focus({ preventScroll: true });
}
$("doneBtn").addEventListener("click", () => { $("done").hidden = true; if (quiz) setMode(true); });

// ------------------------------------------------------------ tapping the map
const tip = $("tip");
function pickMarker(target) { const g = target.closest?.(".marker"); return g ? byId[g.dataset.id] : null; }
markG.addEventListener("click", (e) => {
  const l = pickMarker(e.target); if (!l) return;
  tip.hidden = true;
  if (quiz) answer(l.id); else openCard(l);
});
markG.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const l = pickMarker(e.target); if (!l) return; e.preventDefault();
  if (quiz) answer(l.id); else openCard(l);
});
markG.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  const l = pickMarker(e.target); if (!l || quiz) { tip.hidden = true; return; }
  tip.textContent = `${l.language}: ${l.hello}`; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.hidden = false;
});
markG.addEventListener("pointerleave", () => (tip.hidden = true));

// ------------------------------------------------------------ confetti
const cv = $("confetti"), cx = cv.getContext("2d");
const COLORS = Object.values(D.scripts).map((s) => s.color);
let bits = [], raf = 0;
function burst(n) {
  if (reduce) return;
  for (let k = 0; k < n; k++) bits.push({ x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4,
    r: Math.random() * 6.3, s: 6 + Math.random() * 8, c: COLORS[k % COLORS.length], life: 140 });
  if (!raf) raf = requestAnimationFrame(drawConfetti);
}
function drawConfetti() {
  cv.width = innerWidth; cv.height = innerHeight;
  bits = bits.filter((b) => b.life-- > 0 && b.y < innerHeight + 40);
  for (const b of bits) { b.vy += .42; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.r += .15;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore(); }
  raf = bits.length ? requestAnimationFrame(drawConfetti) : 0;
}
</script>
