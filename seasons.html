<!-- Seasonal themes. Switch on and off by date (UK time), so nothing needs pushing on the day.
     Valentine's: 7-14 February.  Halloween: 30-31 October.  Christmas: 15 November - 2 January.
     Preview any time by adding ?season=valentine, ?season=halloween or ?season=christmas to a page address. -->
<script>
(function () {
  var forced = new URLSearchParams(location.search).get("season");
  var p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", month: "numeric", day: "numeric" }).formatToParts(new Date());
  var m = +p.find(function (x) { return x.type === "month"; }).value, d = +p.find(function (x) { return x.type === "day"; }).value;
  var season = forced || ((m === 10 && d >= 30) ? "halloween" : ((m === 11 && d >= 15) || m === 12 || (m === 1 && d <= 2)) ? "christmas" : (m === 2 && d >= 7 && d <= 14) ? "valentine" : "");
  if (!season || season === "none") return;
  document.documentElement.classList.add("season-" + season);
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.addEventListener("DOMContentLoaded", function () {
    var layer = document.createElement("div");
    layer.className = "season-layer";
    layer.setAttribute("aria-hidden", "true");
    if (season === "halloween") {
      var bat = '<svg viewBox="0 0 64 28"><path d="M32 9c-2-4-3-5-3-5l-1 4c-5-6-15-7-28-1 6 1 9 4 10 8 3-2 7-1 9 2 3-3 7-3 10 1 0 0 2 2 3 2s3-2 3-2c3-4 7-4 10-1 2-3 6-4 9-2 1-4 4-7 10-8-13-6-23-5-28 1l-1-4s-1 1-3 5z"/></svg>';
      for (var i = 0; i < 3; i++) {
        var b = document.createElement("span");
        b.className = "season-bat";
        b.style.top = (90 + i * 46) + "px";
        b.style.animationDelay = (i * 2.6) + "s";
        b.style.width = (30 - i * 6) + "px";
        b.innerHTML = bat;
        layer.appendChild(b);
      }
    } else if (season === "valentine" && !still) {
      var navv = document.querySelector(".navbar");
      if (navv) {
        var heart = '<svg viewBox="0 0 24 22"><path d="M12 21C5 15 0 11 0 6a6 6 0 0 1 12-1 6 6 0 0 1 12 1c0 5-5 9-12 15z"/></svg>';
        for (var k = 0; k < 14; k++) {
          var h = document.createElement("span");
          h.className = "season-heart";
          h.style.left = Math.random() * 100 + "%";
          h.style.animationDuration = (5 + Math.random() * 5) + "s";
          h.style.animationDelay = (-Math.random() * 9) + "s";
          h.style.width = (7 + Math.random() * 7) + "px";
          h.innerHTML = heart;
          layer.appendChild(h);
        }
        layer.classList.add("in-navbar");
        navv.appendChild(layer);
        return;
      }
    } else if (season === "christmas" && !still) {
      var nav = document.querySelector(".navbar");
      if (nav) {
        for (var j = 0; j < 40; j++) {
          var f = document.createElement("span");
          f.className = "season-snow";
          f.style.left = Math.random() * 100 + "%";
          f.style.animationDuration = (4 + Math.random() * 5) + "s";
          f.style.animationDelay = (-Math.random() * 8) + "s";
          f.style.opacity = 0.35 + Math.random() * 0.5;
          var s = 2 + Math.random() * 3;
          f.style.width = f.style.height = s + "px";
          layer.appendChild(f);
        }
        layer.classList.add("in-navbar");
        nav.appendChild(layer);
        return;
      }
    }
    document.body.appendChild(layer);
  });
})();
</script>
