project:
  type: website
  output-dir: docs        # GitHub Pages serves this folder (Settings > Pages > main, /docs)
  resources:
    - CNAME
    - cartoonography/downloads/*.pdf

website:
  title: "@ET"
  description: "Data, maps and decisions. Notes and projects by Eriola Trungu Impersimi."
  site-url: https://etymo.co.uk
  favicon: assets/et-mark.svg
  open-graph: true
  navbar:
    logo: assets/et-mark.svg
    logo-alt: "@ET"
    title: false
    left:
      - href: index.qmd
        text: Home
      - href: blog.qmd
        text: Blog
      - href: projects.qmd
        text: Projects
      - href: cartography/index.qmd
        text: cARTography
      - href: cartoonography/index.qmd
        text: carTOONography
      - href: open-source.qmd
        text: Open Source
      - href: publications.qmd
        text: Publications
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/eritrouib
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/eriola-trungu-impersimi/
        aria-label: LinkedIn
      - icon: rss
        href: blog.xml
        aria-label: RSS feed
  page-footer:
    left: "© 2026 Eriola Trungu Impersimi · @ET · etymo.co.uk"
    right: "[☕ Buy me a coffee](https://buymeacoffee.com/etymo) · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header: seasons.html
