<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help Santa deliver!</title>
<meta name="description" content="Help Santa deliver presents around the world on Christmas Eve, following midnight from time zone to time zone. A carTOONography map by @ET.">
<link rel="icon" href="../../assets/et-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@500;700&display=swap">
<style>
/* Night-sky map; the "midnight clock" card top-centre, Santa's sack on the right (bottom sheet on phones), zoom bottom-left. */
:root { --ink: #1F2440; --card: #fff; --red: #D7263D; --gold: #F6C445; --muted: #4A4E69; --found: #22a35a;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif; --body: "Poppins", "Segoe UI", system-ui, sans-serif;
  --edge: 3px solid var(--ink); --pop: 0 5px 0 var(--ink); color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: radial-gradient(ellipse at 50% 0%, #2A3F7A, #16224A 60%, #0F1836); color: var(--ink); font: 500 15px/1.4 var(--body); }
button { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; touch-action: none; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map.dragging { cursor: grabbing; }
#map .lab { font-family: var(--body); font-weight: 700; fill: #fff; paint-order: stroke; stroke: #0F1836; stroke-linejoin: round; pointer-events: none; }
#map .tick { font-family: var(--body); font-weight: 700; fill: #fff; text-anchor: middle; pointer-events: none; }
.stop { cursor: pointer; }
.stop:focus { outline: none; }
.stop:focus-visible .st { stroke: #7DD3FC; }
.stop .num { font-family: var(--display); fill: var(--ink); text-anchor: middle; pointer-events: none; display: none; }
.stop.done .num { display: block; }
.stop.done .st { fill: #fff; }
.stop .gift { display: none; }
.stop.done .gift { display: block; }
.band.hint { animation: glow 1s ease-in-out 3; }
@keyframes glow { 50% { opacity: .95; fill: #FFE59A; } }
.tapring { fill: none; stroke-width: 3px; animation: ring .8s ease-out forwards; }
.tapring.bad { stroke: #FF8A8A; }
@keyframes ring { from { opacity: 1; } to { opacity: 0; } }
.panel { position: fixed; z-index: 2; background: var(--card); border: var(--edge); border-radius: 18px; box-shadow: var(--pop); }
.display { font-family: var(--display); font-weight: 400; }
#clock { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); width: min(400px, calc(100vw - 28px)); padding: 12px 16px 14px; }
#clock h1 { margin: 0; font-size: clamp(26px, 4.4vw, 38px); line-height: 1; color: var(--red); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
#clock .msg { margin: 6px 0 8px; font-weight: 700; }
#clock .msg small { display: block; font-weight: 500; color: var(--muted); }
#clock .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#feedback { min-height: 1.4em; margin: 8px 0 0; font-weight: 700; color: #B42318; }
#feedback.good { color: var(--found); }
#sack { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: 270px; max-height: calc(100% - 100px); display: flex; flex-direction: column; overflow: hidden; }
#sack header { padding: 12px 16px 8px; display: grid; gap: 6px; grid-template-columns: 1fr auto; align-items: center; }
#sack h2 { margin: 0; font-size: 23px; color: #2E8B57; }
.progress { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #eef1f7; }
.bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .4s; }
#list { list-style: none; margin: 0; padding: 4px 12px 12px; overflow-y: auto; display: grid; gap: 3px; }
#list button { width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; border: 0; border-radius: 10px; background: transparent; padding: 4px 6px; text-align: left; cursor: pointer; font-size: 13.5px; font-weight: 700; }
#list button:hover { background: #f1f4fb; }
#list svg { width: 24px; height: 24px; }
#list li:not(.done) svg { filter: grayscale(1) brightness(1.4); opacity: .5; }
#list li:not(.done) .nm { color: #9aa0b6; }
#list .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
#sack.collapsed #list, #sack.collapsed #restart { display: none; }
#restart { margin: 0 16px 12px; justify-self: start; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border: var(--edge); border-radius: 14px; background: #fff; box-shadow: 0 4px 0 var(--ink); font-weight: 700; cursor: pointer; line-height: 1; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.small { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
.btn.gold { background: var(--gold); }
button:focus-visible { outline: 3px solid #7DD3FC; outline-offset: 2px; }
#zoom { position: fixed; z-index: 2; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
#zoom .pm { width: 42px; justify-content: center; font-size: 20px; padding: 6px 0; }
#credit { position: fixed; z-index: 1; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.88); font-size: 11px; color: var(--muted); }
#credit a { color: inherit; }
#card { left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4; width: min(420px, calc(100vw - 24px)); padding: 16px 20px; display: grid; gap: 4px; justify-items: center; text-align: center; }
#card .pic svg { width: 64px; height: 64px; }
#card .yay { margin: 0; font-family: var(--display); font-size: 19px; color: var(--found); }
#card h3 { margin: 0; font-size: 28px; line-height: 1.05; }
#card .where { color: var(--muted); font-weight: 700; margin-top: -2px; }
#card .fact { margin: 4px 0 0; max-width: 38ch; line-height: 1.5; }
#card .time { margin: 4px 0 0; font-size: 13px; font-weight: 700; color: #2E5AAC; }
#card .close { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; cursor: pointer; font-weight: 700; }
#done { left: 50%; top: 18%; transform: translateX(-50%); z-index: 5; padding: 18px 26px; text-align: center; width: min(400px, calc(100vw - 24px)); }
#done h3 { margin: 0; font-size: clamp(30px, 6vw, 42px); color: var(--red); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
#done p { margin: 6px 0 12px; font-weight: 700; }
#snow { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
@media (max-width: 760px) {
  body { font-size: 14px; }
  #clock { padding: 10px 12px 12px; } #clock .msg { font-size: 13.5px; }
  #zoom .pm { display: none; }
  #sack { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 50%; }
  #zoom { bottom: auto; top: calc(var(--clockH, 190px) + 20px + env(safe-area-inset-top, 0px)); }
  #zoom .btn { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
  #credit { right: auto; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); font-size: 9.5px; max-width: 250px; }
  #card { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 12px 14px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .tapring, .band.hint { animation: none; } }
</style>

<div id="stage"><svg id="map" role="img" aria-label="World map at night with time zones and 18 places for Santa to visit"></svg></div>
<section id="clock" class="panel" aria-live="polite">
  <h1 class="display">Help Santa deliver!</h1>
  <p class="msg" id="msg"></p>
  <div class="row"><button class="btn small gold" type="button" id="hint">💡 Hint</button><span id="score" style="font-weight:700"></span></div>
  <p id="feedback"></p>
</section>
<aside id="sack" class="panel" aria-label="Santa's sack">
  <header>
    <h2 class="display">Santa's sack</h2>
    <button id="sheetToggle" class="btn small" type="button" aria-expanded="true" aria-controls="list">Hide</button>
    <div class="progress"><div class="bar" aria-hidden="true"><i id="barFill"></i></div><span id="count">0 / 18</span></div>
  </header>
  <ul id="list"></ul>
  <button id="restart" class="btn small" type="button">Start again</button>
</aside>
<nav id="zoom" aria-label="Zoom">
  <button class="btn" type="button" id="home">🌍 Whole world</button>
  <button class="btn pm" type="button" id="zin" aria-label="Zoom in">+</button>
  <button class="btn pm" type="button" id="zout" aria-label="Zoom out">−</button>
</nav>
<p id="credit">Map: Natural Earth · Drawings by <a href="../">@ET · etymo.co.uk</a></p>
<div id="card" class="panel" role="dialog" aria-labelledby="cardName" hidden>
  <button class="close" type="button" id="cardClose" aria-label="Close">✕</button>
  <div class="pic" id="cardPic"></div><p class="yay" id="cardYay"></p>
  <h3 class="display" id="cardName"></h3><div class="where" id="cardWhere"></div>
  <p class="fact" id="cardFact"></p><p class="time" id="cardTime"></p>
</div>
<div id="done" class="panel" hidden><h3 class="display">Merry Christmas!</h3><p id="doneText"></p><button class="btn gold" type="button" id="doneBtn">Deliver again</button></div>
<canvas id="snow"></canvas>

ST.forEach((s, i) => {
