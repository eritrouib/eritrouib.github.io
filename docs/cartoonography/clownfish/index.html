<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the clownfish!</title>
<meta name="description" content="Explore 21,000 real clownfish sightings, fill your fish book with 12 kinds of clownfish and take the quiz. A carTOONography map by @ET.">
<link rel="icon" href="../../assets/et-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:ital,wght@0,500;0,700;1,500&display=swap">
<style>
/* A full-screen ocean map with chunky game cards floating over it: title and modes top-left,
   the fish book right (a bottom sheet on phones), zoom buttons bottom-left, the fish card bottom-centre. */
:root {
  --ink: #22263a; --card: #fff; --sun: #FFCE2E; --muted: #5b6178; --found: #22a35a; --orange: #F47A20;
  --sea: #BFE5F8; --land: #FBE3B8; --reef: #F08AA0;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Poppins", "Segoe UI", system-ui, sans-serif;
  --edge: 3px solid var(--ink); --pop: 0 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--sea); color: var(--ink); font: 500 15px/1.4 var(--body); }
button { font: inherit; color: inherit; }

#stage { position: fixed; inset: 0; touch-action: none; background: #D8F0FB; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map.dragging, #map.dragging .fishmark { cursor: grabbing; }
#map .sea { fill: var(--sea); }
#map .land { fill: var(--land); stroke: #E9C995; stroke-width: .8; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#map .reef { fill: none; stroke: var(--reef); stroke-width: 1.6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
#map .dots circle { fill: var(--orange); fill-opacity: .45; }
#map.focus .dots circle { fill-opacity: .12; }
#map .hl circle { fill: var(--orange); stroke: #fff; vector-effect: non-scaling-stroke; stroke-width: 1; }
#map .ocean { font-family: var(--body); font-style: italic; fill: #4f8db3; text-anchor: middle; pointer-events: none; }
.fishmark { cursor: pointer; }
.fishmark .ring { fill: #fff; stroke: var(--ink); vector-effect: non-scaling-stroke; stroke-width: 2.5; }
.fishmark.got .ring { stroke: var(--found); stroke-width: 3.5; }
.fishmark:focus { outline: none; }
.fishmark:focus-visible .ring { stroke: #3b82f6; stroke-width: 4; }
.fishmark .bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes bob { 50% { transform: translateY(-6%) rotate(-3deg); } }
.tapring { fill: none; stroke: var(--ink); stroke-width: 3; vector-effect: non-scaling-stroke; animation: ring .7s ease-out forwards; }
.tapring.good { stroke: var(--found); } .tapring.bad { stroke: #c2410c; }
@keyframes ring { from { opacity: 1; } to { opacity: 0; } }

.panel { position: fixed; z-index: 2; background: var(--card); border: var(--edge); border-radius: 18px; box-shadow: var(--pop); }
.display { font-family: var(--display); font-weight: 400; letter-spacing: .01em; }
.outlined { color: var(--orange); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--ink); }

#title { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 12px 16px 14px; width: min(410px, calc(100vw - 32px)); }
#title h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1; }
#title p { margin: 6px 0 10px; color: var(--muted); }
#title p.howto { margin-top: -4px; font-size: 12.5px; }
.tabs { display: inline-flex; border: var(--edge); border-radius: 14px; overflow: hidden; }
.tabs button { border: 0; background: #fff; padding: 8px 16px; font-weight: 700; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--sun); }
.tabs button + button { border-left: var(--edge); }

#book { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 300px;
  max-height: calc(100% - 110px); display: flex; flex-direction: column; overflow: hidden; }
#book header { padding: 12px 16px 8px; display: grid; gap: 6px; grid-template-columns: 1fr auto; align-items: center; }
#book h2 { margin: 0; font-size: 26px; }
.progress { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #eef1f7; }
.bar i { display: block; height: 100%; width: 0; background: var(--found); transition: width .4s; }
#fishes { list-style: none; margin: 0; padding: 6px 12px 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
#fishes button { width: 100%; border: 2px dashed #9aa2b8; border-radius: 14px; background: #f4f7fb; cursor: pointer; padding: 6px 6px 8px; text-align: center; line-height: 1.15; }
#fishes .pic { height: 40px; display: flex; justify-content: center; }
#fishes .pic svg { height: 40px; width: auto; }
#fishes li:not(.got) .pic svg { filter: grayscale(1) brightness(1.45) contrast(.55); opacity: .7; }
#fishes .nm { font-size: 11.5px; font-weight: 700; display: block; margin-top: 2px; }
#fishes li.got button { border: 2px solid var(--found); background: #fff; }
#fishes li:not(.got) .nm { color: var(--muted); }
#restart { margin: 0 16px 12px; justify-self: start; }
#book.collapsed #fishes, #book.collapsed #restart { display: none; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: var(--edge); border-radius: 14px; background: #fff;
  box-shadow: 0 4px 0 var(--ink); font-weight: 700; cursor: pointer; line-height: 1; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn[aria-pressed="true"], .btn.primary { background: var(--sun); }
.btn.small { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
button:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }

#zoom { position: fixed; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100vw - 360px); }
#zoom .pm { width: 42px; justify-content: center; font-size: 20px; padding: 6px 0; }
#credit { position: fixed; z-index: 1; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.88); font-size: 11px; color: var(--muted); max-width: 330px; }
#credit a { color: inherit; }

#card { left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4;
  width: min(420px, calc(100vw - 24px)); padding: 16px 20px 16px; display: grid; gap: 4px; justify-items: center; text-align: center; }
#card .pic svg { width: min(220px, 55vw); height: auto; }
#card h3 { margin: 0; font-size: 30px; line-height: 1.05; }
#card .sci { font-style: italic; color: var(--muted); margin-top: -2px; }
#card .yay { margin: 0; font-family: var(--display); font-size: 19px; color: var(--found); }
#card .look { margin: 2px 0 0; font-weight: 700; }
#card .fact { margin: 2px 0 0; max-width: 38ch; line-height: 1.5; }
#card .meta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 12px; margin-top: 4px; }
.chip { border: 2px solid var(--ink); border-radius: 99px; padding: 2px 10px; font-weight: 700; }
#card .close { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; cursor: pointer; font-weight: 700; }

#quiz { left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 3; padding: 10px 18px 12px; text-align: center; width: min(380px, calc(100vw - 24px)); }
#quiz .q { font-weight: 700; }
#quiz .pic svg { height: 54px; width: auto; }
#quiz .opts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
#quiz .status { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; margin-top: 6px; }
#quiz .hint { min-height: 1.4em; margin: 4px 0 0; font-weight: 700; }
#quiz .hint.good { color: var(--found); } #quiz .hint.bad { color: #c2410c; }

#done { left: 50%; top: 22%; transform: translateX(-50%); z-index: 5; padding: 18px 26px; text-align: center; width: min(380px, calc(100vw - 24px)); }
#done h3 { margin: 0; font-size: clamp(30px, 6vw, 42px); }
#done p { margin: 6px 0 12px; font-weight: 700; }
#confetti { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
#tip { position: fixed; z-index: 3; pointer-events: none; padding: 5px 9px; border: 2px solid var(--ink); border-radius: 10px; background: #fff;
  font-weight: 700; font-size: 13px; transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; }

@media (max-width: 1100px) and (min-width: 761px) { #book { width: 250px; } }
@media (max-width: 760px) {
  body { font-size: 14px; }
  #title { padding: 10px 12px 12px; }
  #title p { font-size: 13px; margin: 4px 0 8px; }
  #title p.howto, #zoom .pm { display: none; }
  #book { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 52%; }
  #book h2 { font-size: 21px; }
  #fishes { grid-template-columns: repeat(3, 1fr); }
  #zoom { bottom: auto; top: calc(160px + env(safe-area-inset-top, 0px)); flex-wrap: nowrap; gap: 6px; left: max(10px, env(safe-area-inset-left, 0px)); max-width: calc(100vw - 20px); }
  #zoom .btn { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
  #credit { bottom: auto; top: calc(206px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: auto; font-size: 10px; }
  #card { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 12px 14px; }
  #card .pic svg { width: 150px; }
  #quiz { top: auto; bottom: calc(116px + env(safe-area-inset-bottom, 0px)); }
  body.quizzing #title { display: none; }
  body.quizzing #zoom { top: calc(14px + env(safe-area-inset-top, 0px)); }
  body.quizzing #credit { top: calc(100px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .fishmark .bob, .tapring { animation: none; } }
</style>

<div id="stage"><svg id="map" role="img" aria-label="Ocean map of clownfish sightings around the Indian and Pacific Oceans"></svg></div>

<section id="title" class="panel">
  <h1 class="display outlined">Find the clownfish!</h1>
  <p id="intro">Twelve kinds of clownfish are hiding on the map. Tap each one to add it to your fish book.</p>
  <p class="howto">✋ Drag the map to move it. Pinch, scroll or use + and − to zoom.</p>
  <div class="tabs" role="group" aria-label="Mode">
    <button type="button" id="modeExplore" aria-pressed="true">🐠 Explore</button>
    <button type="button" id="modeQuiz" aria-pressed="false">❓ Quiz</button>
  </div>
</section>

<aside id="book" class="panel" aria-label="My fish book">
  <header>
    <h2 class="display outlined">My fish book</h2>
    <button id="sheetToggle" class="btn small" type="button" aria-expanded="true" aria-controls="fishes">Hide</button>
    <div class="progress"><div class="bar" aria-hidden="true"><i id="barFill"></i></div><span id="count">0 / 12</span></div>
  </header>
  <ul id="fishes"></ul>
  <button id="restart" class="btn small" type="button">Start again</button>
</aside>

<nav id="zoom" aria-label="Zoom to"></nav>
<p id="credit"></p>

<div id="card" class="panel" role="dialog" aria-labelledby="cardName" hidden>
  <button class="close" type="button" id="cardClose" aria-label="Close">✕</button>
  <div class="pic" id="cardPic"></div>
  <p class="yay" id="cardYay"></p>
  <h3 class="display" id="cardName"></h3>
  <div class="sci" id="cardSci"></div>
  <p class="look" id="cardLook"></p>
  <p class="fact" id="cardFact"></p>
  <div class="meta"><span class="chip" id="cardWhere"></span><span class="chip" id="cardCount"></span></div>
</div>

<div id="quiz" class="panel" hidden>
  <div class="pic" id="quizPic"></div>
  <div class="q" id="quizQ"></div>
  <div class="opts" id="quizOpts"></div>
  <p class="hint" id="quizHint" aria-live="polite"></p>
  <div class="status"><span id="quizNum"></span><button class="btn small" type="button" id="quizSkip">Skip ⏭</button><span id="quizScore"></span></div>
</div>

<div id="done" class="panel" hidden>
  <h3 class="display outlined" id="doneTitle"></h3>
  <p id="doneText"></p>
  <button class="btn primary" type="button" id="doneBtn">Play again</button>
</div>
<div id="tip" hidden></div>
<canvas id="confetti"></canvas>

<script>// Draws a side-on clownfish (facing right) as an SVG string, from a species' "draw" pattern.
// Box is 100 x 52. Bands are placed by u: 0 at the nose, 1 at the base of the tail.
function fishSVG(d, uid, opts) {
  opts = opts || {};
  const ink = "#22263a", white = d.bandColor || "#FFFFFF";
  const body = "M97,26 C95,13 81,6 61,6 C42,6 30,12 23,19 L23,33 C30,40 42,46 61,46 C81,46 95,39 97,26 Z";
  const tail = "M25,20 C17,12 9,8 3,8 C6,18 6,34 3,44 C9,44 17,40 25,32 Z";
  const dorsal = "M36,10 C42,0 60,-1 74,7 L70,9 C58,6 46,7 36,12 Z";
  const anal = "M42,42 C48,51 58,52 66,44 Z";
  const pelvic = "M68,43 C66,50 72,52 76,44 Z";
  const pect = "M75,29 C69,32 66,37 68,39 C74,38 78,33 79,29 Z";
  const X = (u) => 95 - u * 72;
  const clip = `cf-${uid}`;
  let inside = "";
  if (d.face) inside += `<ellipse cx="86" cy="30" rx="19" ry="17" fill="${d.face}"/>`;
  if (d.dark) inside += `<ellipse cx="54" cy="32" rx="25" ry="14" fill="${d.dark}" opacity=".9"/>`;
  for (const [u, w] of d.bands) {
    const x = X(u), bw = w * 72, e = d.edge || 0;
    if (e) inside += `<rect x="${(x - bw / 2 - e).toFixed(1)}" y="-5" width="${(bw + 2 * e).toFixed(1)}" height="62" fill="${ink}"/>`;
    inside += `<rect x="${(x - bw / 2).toFixed(1)}" y="-5" width="${bw.toFixed(1)}" height="62" fill="${white}"/>`;
  }
  if (d.stripe === "back") inside += `<path d="M90,13 C74,7 46,7 24,21" stroke="${white}" stroke-width="3.4" fill="none"/>`;
  if (d.stripe === "lip") inside += `<path d="M96,21 C86,9 50,7 24,21" stroke="${white}" stroke-width="4.6" fill="none"/>`;
  if (d.saddle) inside += `<path d="M44,3 L60,5 C58,14 55,21 50,25 C46,20 43,12 44,3 Z" fill="${white}"/>`;
  const fins = d.fins || d.body, tailC = d.tail || fins, belly = d.belly || fins;
  const s = opts.stroke ?? 1.6;
  return `<svg viewBox="-2 -3 104 58" xmlns="http://www.w3.org/2000/svg"${opts.attrs || ""}>
<defs><clipPath id="${clip}"><path d="${body}"/><path d="${dorsal}"/><path d="${tail}"/><path d="${anal}"/></clipPath></defs>
<path d="${tail}" fill="${tailC}" stroke="${ink}" stroke-width="${s}"/>
<path d="${dorsal}" fill="${fins}" stroke="${ink}" stroke-width="${s}"/>
<path d="${anal}" fill="${belly}" stroke="${ink}" stroke-width="${s}"/>
<path d="${pelvic}" fill="${belly}" stroke="${ink}" stroke-width="${s}"/>
<path d="${body}" fill="${d.body}"/>
<g clip-path="url(#${clip})">${inside}</g>
<path d="${body}" fill="none" stroke="${ink}" stroke-width="${s}"/>
<path d="${pect}" fill="${fins}" stroke="${ink}" stroke-width="${s * 0.8}"/>
<circle cx="87" cy="21" r="3" fill="${ink}"/><circle cx="88" cy="20" r="0.9" fill="#fff"/>
</svg>`;
}
if (typeof module !== "undefined") module.exports = { fishSVG };

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const S = D.species, W = D.world, SVGNS = "http://www.w3.org/2000/svg";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const byId = Object.fromEntries(S.map((s) => [s.id, s]));
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
let quiz = null;
$("credit").innerHTML = `Sightings: <a href="https://obis.org" target="_blank" rel="noopener">OBIS</a>, ${D.records.toLocaleString("en-GB")} records from ${D.datasets} datasets (${D.lic}) · Land and reefs: Natural Earth · <a href="../">@ET · etymo.co.uk</a>`;

// ------------------------------------------------------------ the map
const svg = $("map");
el("path", { d: W.sea, class: "sea" }, svg);
el("path", { d: W.land, class: "land" }, svg);
el("path", { d: W.reefs, class: "reef" }, svg);
const dotsG = el("g", { class: "dots" }, svg);
for (const [x, y] of D.dots) el("circle", { cx: x, cy: y, r: 1 }, dotsG);
const hlG = el("g", { class: "hl" }, svg);
const oceanG = el("g", {}, svg);
for (const o of W.oceans) { const t = el("text", { x: o.x, y: o.y, class: "ocean" }, oceanG); t.textContent = o.name; }
const fishG = el("g", {}, svg);
const marks = {};
S.forEach((s, i) => {
  const g = el("g", { class: "fishmark", tabindex: 0, role: "button", "aria-label": `A hidden clownfish` }, fishG);
  g.dataset.id = s.id;
  el("circle", { class: "ring", cx: s.home[0], cy: s.home[1], r: 10 }, g);
  const inner = el("g", { class: "bob" }, g);
  inner.innerHTML = fishSVG(s.draw, "m" + i);
  marks[s.id] = g;
});
const tapG = el("g", {}, svg);

let vb = W.regions.World.slice(), region = "World", vbAnim = null;
function sizeMarkers() {
  const k = vb[2] / Math.max(svg.clientWidth, 1);                 // map units per screen pixel
  const r = (svg.clientWidth <= 760 ? 19 : 24) * k;
  for (const s of S) {
    const g = marks[s.id], [ring, inner] = g.children, f = inner.firstElementChild;
    ring.setAttribute("r", r);
    const w = r * 1.55;
    f.setAttribute("x", s.home[0] - w / 2); f.setAttribute("y", s.home[1] - w * 0.29); f.setAttribute("width", w); f.setAttribute("height", w * 0.58);
  }
  for (const c of dotsG.children) c.setAttribute("r", 2.6 * k);
  for (const c of hlG.children) c.setAttribute("r", c.dataset.n * k);
  for (const t of oceanG.children) t.style.fontSize = 14 * k + "px";
}
function fit(box) {
  const sw = svg.clientWidth || innerWidth, sh = svg.clientHeight || innerHeight, phone = sw <= 760;
  const pad = { l: 16, r: phone ? 16 : $("book").offsetWidth + 40, t: 16, b: 76 };
  if (phone) {
    const vis = (id) => { const e = $(id); return e && !e.hidden && getComputedStyle(e).display !== "none" ? e.getBoundingClientRect() : null; };
    const top = ["title", "zoom", "credit"].map(vis).filter(Boolean), bottom = ["book", "quiz"].map(vis).filter(Boolean);
    pad.t = Math.max(16, ...top.filter((r) => r.top < sh / 2).map((r) => r.bottom + 10));
    pad.b = Math.max(16, ...bottom.filter((r) => r.top > sh / 2).map((r) => sh - r.top + 10));
  }
  const fw = Math.max(sw - pad.l - pad.r, 100), fh = Math.max(sh - pad.t - pad.b, 100);
  const s = Math.min(fw / box[2], fh / box[3]);
  const cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2, fx = pad.l + fw / 2, fy = pad.t + fh / 2;
  return [cx - fx / s, cy - fy / s, sw / s, sh / s];
}
function setVB(v) { vb = v; svg.setAttribute("viewBox", v.map((n) => n.toFixed(2)).join(" ")); sizeMarkers(); }
function zoomTo(name) {
  region = name;
  document.querySelectorAll("#zoom .btn[data-r]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.r === name)));
  const target = fit(W.regions[name]);
  if (reduce) return setVB(target);
  vbAnim = { t0: performance.now(), from: vb.slice(), to: target }; requestAnimationFrame(stepVB);
}
function stepVB(now) {
  if (!vbAnim) return;
  const u = Math.min(1, (now - vbAnim.t0) / 700), e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  setVB(vbAnim.from.map((a, i) => a + (vbAnim.to[i] - a) * e));
  if (u < 1) requestAnimationFrame(stepVB); else vbAnim = null;
}
for (const r of Object.keys(W.regions)) {
  const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.dataset.r = r; b.textContent = r === "World" ? "🌍 World" : r;
  b.setAttribute("aria-pressed", String(r === "World")); b.addEventListener("click", () => zoomTo(r)); $("zoom").appendChild(b);
}
for (const [label, f, name] of [["+", 0.6, "Zoom in"], ["−", 1 / 0.6, "Zoom out"]]) {
  const b = document.createElement("button"); b.className = "btn pm"; b.type = "button"; b.textContent = label; b.setAttribute("aria-label", name);
  b.addEventListener("click", () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f, true); });
  $("zoom").appendChild(b);
}
svg.setAttribute("preserveAspectRatio", "xMinYMin meet");
setVB(fit(W.regions.World));
if (matchMedia("(max-width: 760px)").matches) {   // the whole world is tiny on a phone: start where most of the fish are
  region = "SE Asia"; setVB(fit(W.regions[region]));
  document.querySelectorAll("#zoom .btn[data-r]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.r === region)));
}
addEventListener("resize", () => {
  vbAnim = null;
  if (region) return setVB(fit(W.regions[region]));
  const cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2, upp = vb[2] / (svg.clientWidth || 1);
  const w = (svg.clientWidth || innerWidth) * upp, h = (svg.clientHeight || innerHeight) * upp;
  setVB([cx - w / 2, cy - h / 2, w, h]);
});

// ------------------------------------------------------------ drag to move, scroll or pinch to zoom
const WORLD = W.regions.World;
const tip = $("tip");
function leaveRegion() { region = null; vbAnim = null; document.querySelectorAll("#zoom .btn[data-r]").forEach((b) => b.setAttribute("aria-pressed", "false")); }
function clampVB(v) {
  const sw = svg.clientWidth || innerWidth, minW = sw * 0.08, maxW = Math.max(fit(WORLD)[2] * 1.4, minW);
  let [x, y, w, h] = v;
  const k = Math.min(Math.max(w, minW), maxW) / w, cx = x + w / 2, cy = y + h / 2;
  w *= k; h *= k;
  const ncx = Math.min(Math.max(cx, WORLD[0]), WORLD[0] + WORLD[2]), ncy = Math.min(Math.max(cy, WORLD[1]), WORLD[1] + WORLD[3]);
  return [ncx - w / 2, ncy - h / 2, w, h];
}
function zoomAt(clientX, clientY, f, animate) {
  leaveRegion();
  const r = svg.getBoundingClientRect(), upp = vb[2] / r.width;
  const mx = vb[0] + (clientX - r.left) * upp, my = vb[1] + (clientY - r.top) * upp;
  const target = clampVB([mx - (mx - vb[0]) * f, my - (my - vb[1]) * f, vb[2] * f, vb[3] * f]);
  if (animate && !reduce) { vbAnim = { t0: performance.now(), from: vb.slice(), to: target }; requestAnimationFrame(stepVB); } else setVB(target);
}
svg.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), false); }, { passive: false });
const ptrs = new Map();
let dragged = false, startDist = 0, startVB = null, startMid = null, moved = 0, downAt = null;
svg.addEventListener("pointerdown", (e) => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { dragged = false; moved = 0; downAt = { x: e.clientX, y: e.clientY }; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; startDist = Math.hypot(a.x - b.x, a.y - b.y); startVB = vb.slice(); startMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
});
svg.addEventListener("pointermove", (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) {   // hovering with a mouse: name the fish once it has been found
    const f = e.target.closest?.(".fishmark");
    if (f && e.pointerType === "mouse" && !quiz) { const s = byId[f.dataset.id]; tip.textContent = found.has(s.id) ? s.common : "A hidden clownfish!"; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.hidden = false; }
    else tip.hidden = true;
    return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6 && !dragged) { dragged = true; svg.classList.add("dragging"); tip.hidden = true; try { svg.setPointerCapture(e.pointerId); } catch (err) {} leaveRegion(); }
  if (!dragged) return;
  const r = svg.getBoundingClientRect();
  if (ptrs.size >= 2 && startVB) {
    const [a, b] = [...ptrs.values()], f = startDist / Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1), upp0 = startVB[2] / r.width;
    const mx = startVB[0] + (startMid.x - r.left) * upp0, my = startVB[1] + (startMid.y - r.top) * upp0;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, w = startVB[2] * f, h = startVB[3] * f, upp = w / r.width;
    setVB(clampVB([mx - (mid.x - r.left) * upp, my - (mid.y - r.top) * upp, w, h]));
  } else { const upp = vb[2] / r.width; setVB(clampVB([vb[0] - dx * upp, vb[1] - dy * upp, vb[2], vb[3]])); }
});
function endPtr(e) {
  const wasDrag = dragged;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) startVB = null;
  if (!ptrs.size) { svg.classList.remove("dragging"); setTimeout(() => (dragged = false), 0); }
  if (e.type === "pointerup" && !wasDrag && quiz && quiz.kind === "where" && downAt) mapTap(e.clientX, e.clientY);
}
svg.addEventListener("pointerup", endPtr);
svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("pointerleave", () => (tip.hidden = true));

// ------------------------------------------------------------ fish book
let found = new Set();
try { found = new Set(JSON.parse(localStorage.getItem("clownfish-found") || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem("clownfish-found", JSON.stringify([...found])); } catch (e) {} };
S.forEach((s, i) => {
  const li = document.createElement("li"); li.dataset.id = s.id;
  li.innerHTML = `<button type="button"><span class="pic">${fishSVG(s.draw, "b" + i)}</span><span class="nm"></span></button>`;
  li.querySelector("button").addEventListener("click", () => {
    if (quiz) return;
    if (found.has(s.id)) { flyTo(s); openCard(s, false); }
    else hintAt(s);
  });
  $("fishes").appendChild(li);
});
function refresh() {
  document.querySelectorAll("#fishes li").forEach((li) => {
    const s = byId[li.dataset.id], has = found.has(s.id);
    li.classList.toggle("got", has);
    li.querySelector(".nm").textContent = has ? s.common : "???";
    li.querySelector("button").setAttribute("aria-label", has ? `${s.common}, found` : "Not found yet: tap for a clue");
  });
  for (const s of S) marks[s.id].classList.toggle("got", found.has(s.id));
  $("count").textContent = `${found.size} / ${S.length}`;
  $("barFill").style.width = `${found.size / S.length * 100}%`;
}
refresh();
$("restart").addEventListener("click", () => { found.clear(); save(); refresh(); closeCard(); });
const book = $("book"), sheetBtn = $("sheetToggle");
sheetBtn.addEventListener("click", () => {
  const c = book.classList.toggle("collapsed"); sheetBtn.textContent = c ? "Show" : "Hide"; sheetBtn.setAttribute("aria-expanded", String(!c));
  if (c && region) setVB(fit(W.regions[region]));
});
if (matchMedia("(max-width: 760px)").matches) { book.classList.add("collapsed"); sheetBtn.textContent = "Show"; sheetBtn.setAttribute("aria-expanded", "false"); }
function hintAt(s) {
  showCardText(s, "Still hiding!", `Clue: ${s.where}.`);
}

// ------------------------------------------------------------ the fish card
let current = null;
function highlight(s) {
  hlG.replaceChildren();
  svg.classList.toggle("focus", !!s);
  if (!s) return;
  const max = Math.max(...s.dots.map((d) => d[2]));
  for (const [x, y, n] of s.dots) { const c = el("circle", { cx: x, cy: y }, hlG); c.dataset.n = (2.6 + 4.4 * Math.sqrt(n / max)).toFixed(2); }
  sizeMarkers();
}
function flyTo(s) {
  const k = 110; zoomToBox([s.home[0] - k, s.home[1] - k * 0.6, 2 * k, 1.2 * k]);
}
function zoomToBox(b) {
  leaveRegion();
  const t = fit(b);
  if (reduce) return setVB(t);
  vbAnim = { t0: performance.now(), from: vb.slice(), to: t }; requestAnimationFrame(stepVB);
}
function openCard(s, fresh) {
  current = s;
  $("cardPic").innerHTML = fishSVG(s.draw, "c" + s.id);
  $("cardYay").textContent = fresh ? `You found it! ${found.size} of ${S.length}` : "In your fish book";
  $("cardYay").hidden = false;
  $("cardName").textContent = s.common; $("cardSci").textContent = s.sci; $("cardSci").hidden = false;
  $("cardLook").textContent = s.look; $("cardFact").textContent = s.fact;
  $("cardWhere").textContent = "📍 " + s.where; $("cardWhere").hidden = false;
  $("cardCount").textContent = `👀 ${s.records.toLocaleString("en-GB")} sightings`; $("cardCount").hidden = false;
  $("card").hidden = false;
  if (matchMedia("(max-width: 760px)").matches) { book.classList.add("collapsed"); sheetBtn.textContent = "Show"; }
  highlight(s);
  $("cardClose").focus({ preventScroll: true });
}
function showCardText(s, title, text) {
  current = null;
  $("cardPic").innerHTML = fishSVG(s.draw, "h" + s.id).replace("<svg ", '<svg style="filter:grayscale(1) brightness(1.4) contrast(.55)" ');
  $("cardYay").hidden = true; $("cardName").textContent = title; $("cardSci").hidden = true;
  $("cardLook").textContent = text; $("cardFact").textContent = "Look for a fish in a white circle, then tap it.";
  $("cardWhere").hidden = true; $("cardCount").hidden = true;
  $("card").hidden = false; highlight(null);
}
function closeCard() { $("card").hidden = true; highlight(null); current = null; }
$("cardClose").addEventListener("click", closeCard);
addEventListener("keydown", (e) => { if (e.key === "Escape") closeCard(); });
function collect(s) {
  const fresh = !found.has(s.id);
  if (fresh) { found.add(s.id); save(); refresh(); burst(found.size === S.length ? 260 : 60); }
  openCard(s, fresh);
  if (fresh && found.size === S.length) showDone("Fish book full!", "You found all 12 kinds of clownfish. Brilliant detective work!", "Keep exploring");
}
fishG.addEventListener("click", (e) => {
  if (dragged || quiz) return;
  const g = e.target.closest(".fishmark"); if (!g) return;
  tip.hidden = true; collect(byId[g.dataset.id]);
});
fishG.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && !quiz) { const g = e.target.closest(".fishmark"); if (g) { e.preventDefault(); collect(byId[g.dataset.id]); } }
});

// ------------------------------------------------------------ quiz
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setMode(q) {
  $("modeExplore").setAttribute("aria-pressed", String(!q)); $("modeQuiz").setAttribute("aria-pressed", String(q));
  document.body.classList.toggle("quizzing", q);
  closeCard(); fishG.style.display = q ? "none" : "";
  if (q) {
    const qs = [{ kind: "ocean" }].concat(shuffle(S.slice()).slice(0, 7).map((s) => ({ kind: "where", s })));
    quiz = { qs, i: 0, score: 0, tries: 0, kind: null }; $("quiz").hidden = false; ask();
    $("intro").textContent = "Answer the questions. For the fish, tap the sea where you think it lives.";
  } else {
    quiz = null; $("quiz").hidden = true; $("intro").textContent = "Twelve kinds of clownfish are hiding on the map. Tap each one to add it to your fish book.";
  }
  vbAnim = null; if (region) setVB(fit(W.regions[region])); else sizeMarkers();
}
function ask() {
  const q = quiz.qs[quiz.i]; quiz.tries = 0; quiz.kind = q.kind;
  highlight(null);
  $("quizHint").textContent = ""; $("quizHint").className = "hint"; $("quizOpts").replaceChildren();
  if (q.kind === "ocean") {
    $("quizPic").innerHTML = fishSVG(S[0].draw, "q0");
    $("quizQ").textContent = "Which ocean has NO clownfish at all?";
    for (const o of ["Indian Ocean", "Pacific Ocean", "Atlantic Ocean"]) {
      const b = document.createElement("button"); b.className = "btn small"; b.type = "button"; b.textContent = o;
      b.addEventListener("click", () => oceanAnswer(o, b)); $("quizOpts").appendChild(b);
    }
  } else {
    $("quizPic").innerHTML = fishSVG(q.s.draw, "q" + quiz.i);
    $("quizQ").textContent = `Where does the ${q.s.common} live? Tap the sea there.`;
  }
  $("quizNum").textContent = `Question ${quiz.i + 1} of ${quiz.qs.length}`;
  $("quizScore").textContent = `⭐ ${quiz.score}`;
}
function oceanAnswer(o, b) {
  if (quiz.kind !== "ocean") return;
  if (o === "Atlantic Ocean") {
    quiz.score += quiz.tries === 0 ? 1 : 0;
    $("quizHint").textContent = "Yes! Clownfish live only in the warm Indian and Pacific Oceans."; $("quizHint").className = "hint good";
    $("quizScore").textContent = `⭐ ${quiz.score}`; burst(40); quiz.kind = null;
    setTimeout(next, 2200);
  } else {
    quiz.tries++; b.disabled = true;
    $("quizHint").textContent = `No, lots of clownfish live in the ${o}. Look at all the orange dots!`; $("quizHint").className = "hint bad";
  }
}
function next() {
  quiz.i++;
  if (quiz.i >= quiz.qs.length) {
    const s = quiz.score, n = quiz.qs.length;
    burst(s >= n * 0.7 ? 220 : 60);
    showDone(s === n ? "Perfect score!" : s >= n * 0.7 ? "Brilliant!" : "Good try!", `You got ${s} out of ${n}. You're a real clownfish expert in the making.`, "Play again");
    return;
  }
  ask();
}
// "The Red Sea" -> "in the Red Sea", "From Thailand…" -> "from Thailand…", anything else -> "in …"
function place(w) { return /^From /.test(w) ? "f" + w.slice(1) : /^The /.test(w) ? "in t" + w.slice(1) : "in " + w; }
function ringAt(x, y, cls) {
  const k = vb[2] / svg.clientWidth, c = el("circle", { cx: x, cy: y, r: 16 * k, class: "tapring " + cls }, tapG);
  setTimeout(() => c.remove(), 800);
}
function mapTap(cx, cy) {
  const q = quiz.qs[quiz.i], r = svg.getBoundingClientRect(), upp = vb[2] / r.width;
  const x = vb[0] + (cx - r.left) * upp, y = vb[1] + (cy - r.top) * upp;
  // close enough if the tap lands within about 5 degrees (14 map units) of any sighting of this fish
  const near = q.s.dots.some(([dx, dy]) => Math.hypot(dx - x, dy - y) < 14);
  if (near) {
    quiz.score += quiz.tries === 0 ? 1 : 0; quiz.kind = null;
    ringAt(x, y, "good"); highlight(q.s);
    $("quizHint").textContent = `Yes! The ${q.s.common} lives ${place(q.s.where)}.`; $("quizHint").className = "hint good";
    $("quizScore").textContent = `⭐ ${quiz.score}`; burst(40);
    setTimeout(next, 2200);
  } else {
    quiz.tries++; ringAt(x, y, "bad");
    if (quiz.tries === 1) $("quizHint").textContent = `Not there! Clue: ${q.s.where}.`;
    else { $("quizHint").textContent = "Here's where it's been spotted. Tap one of the orange dots!"; highlight(q.s); }
    $("quizHint").className = "hint bad";
  }
}
$("modeExplore").addEventListener("click", () => setMode(false));
$("modeQuiz").addEventListener("click", () => setMode(true));
$("quizSkip").addEventListener("click", () => { if (quiz) { quiz.kind = null; next(); } });
function showDone(title, text, btn) { $("doneTitle").textContent = title; $("doneText").textContent = text; $("doneBtn").textContent = btn; $("done").hidden = false; $("doneBtn").focus({ preventScroll: true }); }
$("doneBtn").addEventListener("click", () => { $("done").hidden = true; if (quiz) setMode(true); });

// ------------------------------------------------------------ confetti
const cv = $("confetti"), cx2 = cv.getContext("2d");
const COLORS = ["#F47A20", "#FFFFFF", "#22263a", "#FFCE2E", "#E4472A", "#F08AA0"];
let bits = [], raf = 0;
function burst(n) {
  if (reduce) return;
  for (let k = 0; k < n; k++) bits.push({ x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4,
    r: Math.random() * 6.3, s: 6 + Math.random() * 8, c: COLORS[k % COLORS.length], life: 140 });
  if (!raf) raf = requestAnimationFrame(drawConfetti);
}
function drawConfetti() {
  cv.width = innerWidth; cv.height = innerHeight;
  bits = bits.filter((b) => b.life-- > 0 && b.y < innerHeight + 40);
  for (const b of bits) { b.vy += .42; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.r += .15;
    cx2.save(); cx2.translate(b.x, b.y); cx2.rotate(b.r); cx2.fillStyle = b.c; cx2.strokeStyle = "#22263a"; cx2.lineWidth = 1;
    cx2.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx2.strokeRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx2.restore(); }
  raf = bits.length ? requestAnimationFrame(drawConfetti) : 0;
}
