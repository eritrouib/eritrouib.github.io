<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot the deer!</title>
<meta name="description" content="Spot 10 hidden deer in Richmond Park and Bushy Park, explore real deer sightings by season and earn your deer spotter badge. A carTOONography map by @ET.">
<link rel="icon" href="../../assets/et-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:ital,wght@0,500;0,700;1,500&display=swap">
<style>
/* A full-screen storybook map with chunky game cards over it: title and modes top-left, the spotter's
   notebook right (a bottom sheet on phones), filters and zoom bottom-left, the deer card bottom-centre. */
:root {
  --ink: #2b2230; --card: #fff; --sun: #FFCE2E; --muted: #5b5260; --found: #22a35a; --amber: #FFB547;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Poppins", "Segoe UI", system-ui, sans-serif;
  --edge: 3px solid var(--ink); --pop: 0 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #FBEFD5; color: var(--ink); font: 500 15px/1.4 var(--body); }
button { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; touch-action: none; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map.dragging { cursor: grabbing; }
#map .town { font-family: var(--body); font-style: italic; fill: #8f7d5c; text-anchor: middle; pointer-events: none; }
#map .river { font-family: var(--body); font-style: italic; font-weight: 700; fill: #1f86c2; text-anchor: middle; letter-spacing: 8px; pointer-events: none; }
#map .lm { font-family: var(--body); font-weight: 700; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 18px; stroke-linejoin: round; pointer-events: none; }
#map .park { font-family: var(--display); fill: #fff; stroke: #2F6A1E; stroke-width: 26px; paint-order: stroke; text-anchor: middle; letter-spacing: 6px; pointer-events: none; }
#map .landmark { cursor: pointer; }
#map .landmark.ticked circle { stroke: var(--found); stroke-width: 16px; }
#map .sightings path { transition: opacity .3s; }
#map .deer { cursor: pointer; }
#map .deer .spot { fill: #fff; fill-opacity: .0; stroke: none; }
#map .deer.found .spot { fill-opacity: .9; stroke: var(--found); stroke-width: 12px; }
#map .deer:focus { outline: none; }
#map .deer:focus-visible .spot { fill-opacity: .6; stroke: #3b82f6; stroke-width: 14px; }
#map .tapring { fill: none; stroke-width: 18px; animation: ring .8s ease-out forwards; }
#map .tapring.good { stroke: var(--found); } #map .tapring.bad { stroke: #c2410c; }
@keyframes ring { from { opacity: 1; } to { opacity: 0; } }

.panel { position: fixed; z-index: 2; background: var(--card); border: var(--edge); border-radius: 18px; box-shadow: var(--pop); }
.display { font-family: var(--display); font-weight: 400; letter-spacing: .01em; }
.outlined { color: var(--amber); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--ink); }
#title { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 12px 16px 14px; width: min(400px, calc(100vw - 32px)); }
#title h1 { margin: 0; font-size: clamp(32px, 5vw, 46px); line-height: 1; }
#title p { margin: 6px 0 10px; color: var(--muted); }
#title p.howto { margin-top: -4px; font-size: 12.5px; }
.tabs { display: inline-flex; border: var(--edge); border-radius: 14px; overflow: hidden; }
.tabs button { border: 0; background: #fff; padding: 8px 16px; font-weight: 700; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--sun); }
.tabs button + button { border-left: var(--edge); }

#book { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 300px;
  max-height: calc(100% - 110px); display: flex; flex-direction: column; overflow: hidden; }
#book header { padding: 12px 16px 8px; display: grid; gap: 6px; grid-template-columns: 1fr auto; align-items: center; }
#book h2 { margin: 0; font-size: 24px; }
.progress { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #eef1f7; }
.bar i { display: block; height: 100%; width: 0; background: var(--found); transition: width .4s; }
#bookBody { overflow-y: auto; padding: 4px 12px 12px; }
#bookBody h3 { margin: 6px 4px 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
#deerList { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
#deerList button { width: 100%; aspect-ratio: 1; border: 2px dashed #a99c8d; border-radius: 12px; background: #f7f1e7; cursor: pointer; padding: 3px; }
#deerList button svg { width: 100%; height: 100%; }
#deerList li:not(.got) svg { filter: brightness(0) opacity(.18); }
#deerList li.got button { border: 2px solid var(--found); background: #fff; }
#lmList { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
#lmList button { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 5px 6px; border-radius: 10px; cursor: pointer; text-align: left; font-weight: 700; font-size: 13.5px; }
#lmList button:hover { background: #f4efe6; }
#lmList .tick { margin-left: auto; width: 22px; height: 22px; border: 3px solid var(--ink); border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 13px; }
#lmList li.got .tick { background: var(--found); }
#restart { margin: 0 16px 12px; justify-self: start; }
#book.collapsed #bookBody, #book.collapsed #restart { display: none; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border: var(--edge); border-radius: 14px; background: #fff;
  box-shadow: 0 4px 0 var(--ink); font-weight: 700; cursor: pointer; line-height: 1; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn[aria-pressed="true"], .btn.primary { background: var(--sun); }
.btn.small { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
button:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
#controls { position: fixed; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
#controls .row { display: flex; flex-wrap: wrap; gap: 6px; }
#zoom .pm { width: 40px; justify-content: center; font-size: 19px; padding: 6px 0; }
#filters { background: #fff; border: var(--edge); border-radius: 14px; padding: 6px 8px; box-shadow: 0 3px 0 var(--ink); display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12.5px; font-weight: 700; }
#filters .chip { border: 2px solid var(--ink); border-radius: 99px; padding: 3px 9px; background: #fff; cursor: pointer; font-weight: 700; font-size: 12.5px; }
#filters .chip[aria-pressed="true"] { background: var(--sun); }
#filters .chip .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 1.5px solid var(--ink); }
#credit { position: fixed; z-index: 1; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.9); font-size: 11px; color: var(--muted); max-width: 340px; }
#credit a { color: inherit; }

#card { left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 4;
  width: min(420px, calc(100vw - 24px)); padding: 14px 20px 16px; display: grid; gap: 4px; justify-items: center; text-align: center; }
#card .pic { font-size: 56px; line-height: 1; }
#card .pic svg { width: min(170px, 42vw); height: auto; }
#card h3 { margin: 0; font-size: 28px; line-height: 1.05; }
#card .yay { margin: 0; font-family: var(--display); font-size: 19px; color: var(--found); }
#card .fact { margin: 2px 0 0; max-width: 38ch; line-height: 1.5; }
#card .meta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 12px; margin-top: 4px; }
.chipm { border: 2px solid var(--ink); border-radius: 99px; padding: 2px 10px; font-weight: 700; }
#card .close { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; cursor: pointer; font-weight: 700; }

#quiz { left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 3; padding: 10px 18px 12px; text-align: center; width: min(400px, calc(100vw - 24px)); }
#quiz .pic svg { height: 74px; width: auto; }
#quiz .q { font-weight: 700; font-size: 16px; }
#quiz .opts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
#quiz .status { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; margin-top: 8px; }
#quiz .hint { min-height: 1.4em; margin: 6px 0 0; font-weight: 700; }
#quiz .hint.good { color: var(--found); } #quiz .hint.bad { color: #c2410c; }
#done { left: 50%; top: 18%; transform: translateX(-50%); z-index: 5; padding: 18px 26px; text-align: center; width: min(400px, calc(100vw - 24px)); }
#done h3 { margin: 0; font-size: clamp(30px, 6vw, 42px); }
#done .badgeart { font-size: 64px; line-height: 1.1; }
#done p { margin: 6px 0 12px; font-weight: 700; }
#confetti { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
#tip { position: fixed; z-index: 3; pointer-events: none; padding: 5px 9px; border: 2px solid var(--ink); border-radius: 10px; background: #fff;
  font-weight: 700; font-size: 13px; transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; }

@media (max-width: 1100px) and (min-width: 761px) { #book { width: 260px; } }
@media (max-width: 760px) {
  body { font-size: 14px; }
  #title { padding: 10px 12px 12px; }
  #title p { font-size: 13px; margin: 4px 0 8px; }
  #title p.howto, #zoom .pm { display: none; }
  #book { top: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 55%; }
  #book h2 { font-size: 20px; }
  #controls { bottom: auto; top: calc(176px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); }
  #controls .btn { padding: 7px 10px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
  /* phones: filters and zoom each fit one swipeable row */
  #filters, #zoom { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  #filters::-webkit-scrollbar, #zoom::-webkit-scrollbar { display: none; }
  #filters > span:first-child { display: none; }
  #seasonChips { display: contents; }
  #filters .chip, #zoom .btn { flex: none; }
  #filters { font-size: 11.5px; padding: 4px 6px; }
  #filters .chip { font-size: 11.5px; padding: 2px 7px; }
  #credit { right: auto; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); font-size: 9.5px; max-width: 260px; }
  #card { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 12px 14px; }
  #quiz { top: auto; bottom: calc(116px + env(safe-area-inset-bottom, 0px)); }
  body.quizzing #title { display: none; }
  body.quizzing #controls { top: calc(12px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } #map .tapring { animation: none; } }
</style>

<div id="stage"><svg id="map" role="img" aria-label="Storybook map of Richmond Park and Bushy Park with real deer sightings and hidden deer"></svg></div>

<section id="title" class="panel">
  <h1 class="display outlined">Spot the deer!</h1>
  <p id="intro">Ten deer are hiding where real deer are often seen. Look in the glowing patches and tap each one you spot.</p>
  <p class="howto">✋ Drag the map to move it. Pinch, scroll or use + and − to zoom in close.</p>
  <div class="tabs" role="group" aria-label="Mode">
    <button type="button" id="modeExplore" aria-pressed="true">🔭 Explore</button>
    <button type="button" id="modeQuiz" aria-pressed="false">❓ Quiz</button>
  </div>
</section>

<aside id="book" class="panel" aria-label="My spotter's notebook">
  <header>
    <h2 class="display outlined">Spotter's notebook</h2>
    <button id="sheetToggle" class="btn small" type="button" aria-expanded="true" aria-controls="bookBody">Hide</button>
    <div class="progress"><div class="bar" aria-hidden="true"><i id="barFill"></i></div><span id="count">0 / 10</span></div>
  </header>
  <div id="bookBody">
    <h3>Deer spotted</h3><ul id="deerList"></ul>
    <h3>Places visited</h3><ul id="lmList"></ul>
  </div>
  <button id="restart" class="btn small" type="button">Start again</button>
</aside>

<div id="controls">
  <div id="filters" role="group" aria-label="Show sightings">
    <span>Sightings:</span>
    <button class="chip" type="button" data-sp="0" aria-pressed="true"><span class="dot" style="background:#B5522A"></span>Red deer</button>
    <button class="chip" type="button" data-sp="1" aria-pressed="true"><span class="dot" style="background:#E2A13A"></span>Fallow deer</button>
    <span id="seasonChips"></span>
  </div>
  <nav id="zoom" class="row" aria-label="Zoom to"></nav>
</div>
<p id="credit"></p>

<div id="card" class="panel" role="dialog" aria-labelledby="cardName" hidden>
  <button class="close" type="button" id="cardClose" aria-label="Close">✕</button>
  <div class="pic" id="cardPic"></div>
  <p class="yay" id="cardYay"></p>
  <h3 class="display" id="cardName"></h3>
  <p class="fact" id="cardFact"></p>
  <div class="meta" id="cardMeta"></div>
</div>

<div id="quiz" class="panel" hidden>
  <div class="pic" id="quizPic"></div>
  <div class="q" id="quizQ"></div>
  <div class="opts" id="quizOpts"></div>
  <p class="hint" id="quizHint" aria-live="polite"></p>
  <div class="status"><span id="quizNum"></span><button class="btn small" type="button" id="quizSkip">Skip ⏭</button><span id="quizScore"></span></div>
</div>

<div id="done" class="panel" hidden>
  <div class="badgeart" aria-hidden="true">🏅</div>
  <h3 class="display outlined" id="doneTitle"></h3>
  <p id="doneText"></p>
  <button class="btn primary" type="button" id="doneBtn">Play again</button>
</div>
<div id="tip" hidden></div>
<canvas id="confetti"></canvas>

<script>// Original deer drawings for the Deer spotter map: a red deer stag, a fallow buck and a fallow fawn,
// all side-on and facing right. Each returns an SVG string. Shared by the poster and the game.
const INK = "#2b2230";

function legs(x, top, len, color, hoof) {
  // one slim leg with a knee and a dark hoof
  return `<path d="M${x},${top} C${x + 1},${top + len * 0.45} ${x - 1.5},${top + len * 0.55} ${x - 0.5},${top + len} L${x + 3.5},${top + len} C${x + 3},${top + len * 0.55} ${x + 5},${top + len * 0.4} ${x + 5},${top}"
    fill="${color}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M${x - 0.8},${top + len - 3} L${x + 3.8},${top + len - 3} L${x + 4},${top + len + 0.5} L${x - 1},${top + len + 0.5} Z" fill="${hoof}" stroke="${INK}" stroke-width="1"/>`;
}

function redDeerSVG(attrs = "") {
  const coat = "#A8532A", dark = "#7A3A1C", light = "#E9C9A0", antler = "#EEDFC0";
  return `<svg viewBox="8 -34 122 136" xmlns="http://www.w3.org/2000/svg"${attrs}>
  ${legs(36, 60, 32, dark, INK)}${legs(78, 60, 32, dark, INK)}
  <path d="M84,10 C80,0 79,-10 82,-20 M81,-3 C76,-6 74,-10 74,-14 M82,-14 C78,-18 78,-24 80,-28" stroke="${INK}" stroke-width="4.2" fill="none" stroke-linecap="round"/>
  <path d="M84,10 C80,0 79,-10 82,-20 M81,-3 C76,-6 74,-10 74,-14 M82,-14 C78,-18 78,-24 80,-28" stroke="#D9C59E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M29,50 C27,36 42,32 62,33 C80,33 92,37 95,49 C97,62 85,69 62,69 C41,69 30,64 29,50 Z" fill="${coat}" stroke="${INK}" stroke-width="1.6"/>
  <path d="M40,64 C52,69 72,69 86,64 C80,70 50,72 40,64 Z" fill="${light}" opacity=".85"/>
  <ellipse cx="32" cy="47" rx="5.5" ry="9" fill="${light}" stroke="${INK}" stroke-width="1"/>
  <path d="M28,40 C25,42 25,47 27,49" stroke="${INK}" stroke-width="1.4" fill="${dark}"/>
  ${legs(43, 60, 33, coat, INK)}${legs(84, 60, 33, coat, INK)}
  <path d="M80,40 C82,30 86,21 92,15 L104,21 C101,30 97,42 93,52 C88,52 83,48 80,40 Z" fill="${coat}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M93,52 C95,45 97,40 99,33 C96,36 95,30 92,33 C92,28 89,30 88,27 C90,36 89,44 93,52 Z" fill="${dark}"/>
  <path d="M90,14 C93,8 101,7 106,11 L118,18 C121,20 120,25 116,25 L106,26 C100,26 94,22 90,14 Z" fill="${coat}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M110,19 C114,18 118,19 120,21 C119,24 116,25 112,24 Z" fill="${light}"/>
  <circle cx="118.6" cy="20.2" r="1.7" fill="${INK}"/>
  <circle cx="103" cy="15" r="1.9" fill="${INK}"/><circle cx="103.6" cy="14.4" r=".6" fill="#fff"/>
  <path d="M92,11 C87,6 84,6 82,8 C84,12 88,14 93,14 Z" fill="${coat}" stroke="${INK}" stroke-width="1.3"/>
  <path d="M96,9 C93,0 92,-10 95,-22 M94,-3 C99,-5 103,-6 106,-10 M93,2 C98,1 102,0 105,-2 M95,-14 C99,-18 101,-22 101,-27 M95,-20 C92,-24 92,-28 94,-32 M95,-17 C98,-19 104,-22 106,-26" stroke="${INK}" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96,9 C93,0 92,-10 95,-22 M94,-3 C99,-5 103,-6 106,-10 M93,2 C98,1 102,0 105,-2 M95,-14 C99,-18 101,-22 101,-27 M95,-20 C92,-24 92,-28 94,-32 M95,-17 C98,-19 104,-22 106,-26" stroke="${antler}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
}

function fallowDeerSVG(attrs = "") {
  const coat = "#C98B48", dark = "#8E5A26", white = "#FFF8EA", antler = "#EEDFC0";
  const spots = [[44, 44], [52, 41], [60, 40], [68, 40], [76, 42], [48, 51], [56, 49], [64, 48], [72, 49], [80, 50], [40, 52], [60, 56], [70, 57], [52, 57]]
    .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2" fill="${white}"/>`).join("");
  return `<svg viewBox="8 -34 122 136" xmlns="http://www.w3.org/2000/svg"${attrs}>
  ${legs(38, 60, 31, dark, INK)}${legs(78, 60, 31, dark, INK)}
  <path d="M30,50 C28,37 43,33 62,34 C80,34 91,38 94,49 C96,61 85,68 62,68 C42,68 31,63 30,50 Z" fill="${coat}" stroke="${INK}" stroke-width="1.6"/>
  <path d="M36,40 C50,35 72,34 88,38" stroke="${dark}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  ${spots}
  <path d="M40,62 C54,67 72,67 86,62 C80,69 50,70 40,62 Z" fill="${white}" opacity=".9"/>
  <path d="M33,42 C28,44 28,54 33,56 C37,54 37,44 33,42 Z" fill="${white}" stroke="${INK}" stroke-width="1.6"/>
  <path d="M29,40 C26,44 26,50 28,54" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  ${legs(44, 60, 32, coat, INK)}${legs(84, 60, 32, coat, INK)}
  <path d="M80,41 C82,31 86,22 92,16 L103,22 C100,31 96,42 92,51 C87,51 82,48 80,41 Z" fill="${coat}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M90,15 C93,9 101,8 106,12 L117,19 C120,21 119,25 115,25 L106,26 C100,26 94,22 90,15 Z" fill="${coat}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="117.6" cy="20.6" r="1.7" fill="${INK}"/>
  <circle cx="103" cy="16" r="1.9" fill="${INK}"/><circle cx="103.6" cy="15.4" r=".6" fill="#fff"/>
  <path d="M92,12 C86,6 82,6 80,8 C82,13 87,15 93,15 Z" fill="${coat}" stroke="${INK}" stroke-width="1.3"/>
  <path d="M95,9 C93,3 91,-1 89,-4 C85,-7 80,-12 77,-19 C80,-18 81,-20 80,-26 C83,-23 84,-24 85,-30 C87,-25 88,-25 90,-31 C91,-25 93,-24 95,-28 C96,-21 95,-12 93,-6 C94,-1 95,3 97,9 Z" fill="#D9C79E" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M97,10 C95,4 94,0 93,-4 C88,-6 83,-11 79,-20 C82,-19 83,-20 83,-27 C86,-24 87,-25 88,-32 C90,-26 91,-26 94,-32 C95,-26 97,-24 100,-27 C101,-19 101,-11 99,-5 C100,0 101,4 102,10 Z" fill="${antler}" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M95,2 C99,0 102,-2 104,-5" stroke="${INK}" stroke-width="3.8" fill="none" stroke-linecap="round"/>
  <path d="M95,2 C99,0 102,-2 104,-5" stroke="${antler}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>`;
}

function fawnSVG(attrs = "") {
  const coat = "#C9894A", white = "#FFF8EA", dark = "#8E5A26";

// Draws the storybook map of Richmond Park and Bushy Park as SVG markup (units: metres from the top-left corner).
// Shared by the A3 poster and the Deer spotter game.
const MAPC = {
  town: "#FBEFD5", townRoad: "#F1DAA9", green: "#D3EBAE", woodsOut: "#BCDC93",
  park: "#A6DA6C", parkEdge: "#4C8B2B", bracken: "#CDBB5E", water: "#6CC8F2", waterEdge: "#2E9FD8",
  road: "#F6E2B3", roadEdge: "#C9A260", hot: ["#FFE680", "#FFC24D", "#FF9A3C"],
  trees: ["#3F9A3A", "#57B046", "#2E7D32"], treeHi: ["#6CBF5B", "#7CCB66", "#4E9A45"], treeEdge: "#285A25",
  red: "#B5522A", fallow: "#E2A13A", ink: "#2b2230",
};

function hoofPath(x, y, s) {
  // two little teardrops: a deer's footprint
  const k = s / 20;
  const p = (dx) => `M${(x + dx * k).toFixed(1)},${(y - 8 * k).toFixed(1)}c${(-4 * k * Math.sign(dx || 1)).toFixed(1)},0 ${(-6 * k * Math.sign(dx || 1)).toFixed(1)},${(5 * k).toFixed(1)} ${(-5 * k * Math.sign(dx || 1)).toFixed(1)},${(10 * k).toFixed(1)}c${(1 * k * Math.sign(dx || 1)).toFixed(1)},${(4 * k).toFixed(1)} ${(3 * k * Math.sign(dx || 1)).toFixed(1)},${(6 * k).toFixed(1)} ${(5 * k * Math.sign(dx || 1)).toFixed(1)},${(5 * k).toFixed(1)}z`;
  return p(-1) + p(1);
}

function drawMap(D, opts = {}) {
  const L = D.layers, o = [];
  const sep = opts.sightings !== false;
  o.push(`<defs>
  <pattern id="grass" width="140" height="140" patternUnits="userSpaceOnUse">
    <path d="M20,40 l6,-14 l6,14 M80,100 l6,-14 l6,14 M110,30 l5,-12 l5,12 M45,115 l5,-12 l5,12" stroke="#86C152" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </pattern>
  <pattern id="fern" width="110" height="110" patternUnits="userSpaceOnUse">
    <path d="M30,60 q10,-20 24,-26 M38,52 l-8,-6 M44,46 l-6,-8 M42,52 l8,2 M48,46 l8,0" stroke="#A6923A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M80,100 q8,-16 20,-22 M86,94 l-6,-5 M91,89 l-5,-6 M90,94 l6,2" stroke="#A6923A" stroke-width="3" fill="none" stroke-linecap="round"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>`);
  o.push(`<rect x="-4000" y="-4000" width="${D.w + 8000}" height="${D.h + 8000}" fill="${MAPC.town}"/>`);
  o.push(`<path d="${L.townRoads}" stroke="${MAPC.townRoad}" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  o.push(`<path d="${L.green}" fill="${MAPC.green}"/><path d="${L.woodsOut}" fill="${MAPC.woodsOut}"/>`);
  for (const d of Object.values(L.parks)) o.push(`<path d="${d}" fill="#3d5a1f" opacity=".22" transform="translate(16,22)" filter="url(#soft)"/>`);
  for (const d of Object.values(L.parks)) o.push(`<path d="${d}" fill="${MAPC.park}" stroke="${MAPC.parkEdge}" stroke-width="16" stroke-linejoin="round"/><path d="${d}" fill="url(#grass)"/>`);
  o.push(`<path d="${L.bracken}" fill="${MAPC.bracken}" opacity=".5"/><path d="${L.bracken}" fill="url(#fern)" opacity=".8"/>`);
  D.hot.forEach((d, i) => o.push(`<path d="${d}" fill="${MAPC.hot[i]}" opacity="${[0.8, 0.85, 0.9][i]}" filter="url(#glow)" class="hot"/>`));
  o.push(`<path d="${L.parkRoads}" stroke="${MAPC.roadEdge}" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  o.push(`<path d="${L.parkRoads}" stroke="${MAPC.road}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  o.push(`<path d="${L.streams}" stroke="${MAPC.waterEdge}" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  o.push(`<path d="${L.streams}" stroke="${MAPC.water}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  o.push(`<path d="${L.water}" fill="${MAPC.water}" stroke="${MAPC.waterEdge}" stroke-width="6" stroke-linejoin="round"/>`);
  o.push(`<path d="${L.water}" fill="none" stroke="#D6F2FD" stroke-width="3" stroke-dasharray="18 46" transform="translate(-6,-8)" opacity=".9"/>`);
  // trees: shadow, crown, highlight
  const sh = [], cr = [[], [], []], hi = [[], [], []];
  for (const [x, y, c, r] of L.trees) {
    sh.push(`M${x + r * 0.35 + r},${y + r * 0.45}a${r},${r} 0 1,0 ${-2 * r},0a${r},${r} 0 1,0 ${2 * r},0`);
    cr[c].push(`M${x + r},${y}a${r},${r} 0 1,0 ${-2 * r},0a${r},${r} 0 1,0 ${2 * r},0`);
    const hr = r * 0.38, hx = x - r * 0.3, hy = y - r * 0.3;
    hi[c].push(`M${(hx + hr).toFixed(1)},${hy.toFixed(1)}a${hr.toFixed(1)},${hr.toFixed(1)} 0 1,0 ${(-2 * hr).toFixed(1)},0a${hr.toFixed(1)},${hr.toFixed(1)} 0 1,0 ${(2 * hr).toFixed(1)},0`);
  }
  o.push(`<path d="${sh.join("")}" fill="#1f3a14" opacity=".2"/>`);
  for (let c = 0; c < 3; c++) o.push(`<path d="${cr[c].join("")}" fill="${MAPC.trees[c]}" stroke="${MAPC.treeEdge}" stroke-width="2.2"/><path d="${hi[c].join("")}" fill="${MAPC.treeHi[c]}"/>`);
  if (sep) {
    const byS = [[], []];
    for (const [x, y, s] of D.sightings) byS[s].push(hoofPath(x, y, opts.hoof || 26));
    o.push(`<g class="sightings"><path class="s-red" d="${byS[0].join("")}" fill="${MAPC.red}" stroke="${MAPC.ink}" stroke-width="1.6"/>`
      + `<path class="s-fallow" d="${byS[1].join("")}" fill="${MAPC.fallow}" stroke="${MAPC.ink}" stroke-width="1.6"/></g>`);
  }
  return o.join("\n");
}

const PARK_LABEL = { "Richmond Park": [5950, 3850], "Bushy Park": [1720, 4560] };   // spots inside the parks clear of landmarks

function drawLabels(D, opts = {}) {
  const L = D.layers, o = [];
  const fs = opts.scale || 1;
  for (const t of L.towns) {
    if (t.name === "River Thames") o.push(`<text x="${t.x}" y="${t.y}" transform="rotate(-62 ${t.x} ${t.y})" class="river" font-size="${120 * fs}">River Thames</text>`);
    else o.push(`<text x="${t.x}" y="${t.y}" class="town" font-size="${105 * fs}">${t.name}</text>`);
  }
  if (opts.gates !== false) for (const g of L.gates) {
    o.push(`<g class="gate"><rect x="${g.x - 22}" y="${g.y - 14}" width="44" height="28" rx="5" fill="#fff" stroke="${MAPC.ink}" stroke-width="4"/>`
      + `<path d="M${g.x - 13},${g.y - 14}v28M${g.x},${g.y - 14}v28M${g.x + 13},${g.y - 14}v28" stroke="${MAPC.ink}" stroke-width="3"/></g>`);
    if (opts.gateNames) o.push(`<text x="${g.x}" y="${g.y + 62 * fs}" class="gatename" font-size="${54 * fs}">${g.name}</text>`);
  }
  for (const m of L.landmarks) {
    o.push(`<g class="landmark" data-name="${m.name}"><circle cx="${m.x}" cy="${m.y}" r="${88 * fs}" fill="#fff" stroke="${MAPC.ink}" stroke-width="${8 * fs}"/>`
      + `<text x="${m.x}" y="${m.y + 30 * fs}" font-size="${104 * fs}" text-anchor="middle">${m.icon}</text>`
      + `<text x="${m.x}" y="${m.y + 175 * fs}" class="lm" font-size="${78 * fs}">${m.name}</text></g>`);
  }
  for (const [n, [x, y]] of Object.entries(L.parkLabels)) {
    const at = PARK_LABEL[n] || [x, y];
    o.push(`<text x="${at[0]}" y="${at[1]}" class="park" font-size="${280 * fs}">${n}</text>`);
  }
  return o.join("\n");
}

if (typeof module !== "undefined") module.exports = { drawMap, drawLabels, MAPC, hoofPath };

  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; startDist = Math.hypot(a.x - b.x, a.y - b.y); startVB = vb.slice(); startMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
});
svg.addEventListener("pointermove", (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) {
    const lm = e.target.closest?.(".landmark");
    if (lm && e.pointerType === "mouse") { tip.textContent = lm.dataset.name; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.hidden = false; } else tip.hidden = true;
    return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6 && !dragged) { dragged = true; svg.classList.add("dragging"); tip.hidden = true; try { svg.setPointerCapture(e.pointerId); } catch (err) {} leaveRegion(); }
  if (!dragged) return;
  const r = svg.getBoundingClientRect();
  if (ptrs.size >= 2 && startVB) {
    const [a, b] = [...ptrs.values()], f = startDist / Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1), upp0 = startVB[2] / r.width;
    const mx = startVB[0] + (startMid.x - r.left) * upp0, my = startVB[1] + (startMid.y - r.top) * upp0;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, w = startVB[2] * f, h = startVB[3] * f, upp = w / r.width;
    setVB(clampVB([mx - (mid.x - r.left) * upp, my - (mid.y - r.top) * upp, w, h]));
  } else { const upp = vb[2] / r.width; setVB(clampVB([vb[0] - dx * upp, vb[1] - dy * upp, vb[2], vb[3]])); }
});
function endPtr(e) {
  const wasDrag = dragged;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) startVB = null;
  if (!ptrs.size) { svg.classList.remove("dragging"); setTimeout(() => (dragged = false), 0); }
  if (e.type === "pointerup" && !wasDrag && quiz && quiz.tap) mapTap(e.clientX, e.clientY);
}
svg.addEventListener("pointerup", endPtr);
svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("pointerleave", () => (tip.hidden = true));

// ------------------------------------------------------------ notebook
let spotted = new Set(), visited = new Set();
try { spotted = new Set(JSON.parse(localStorage.getItem("deer-spotted") || "[]")); visited = new Set(JSON.parse(localStorage.getItem("deer-visited") || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem("deer-spotted", JSON.stringify([...spotted])); localStorage.setItem("deer-visited", JSON.stringify([...visited])); } catch (e) {} };
D.hidden.forEach((h, i) => {
  const li = document.createElement("li"); li.dataset.i = i;
  li.innerHTML = `<button type="button">${h.sp === "red" ? redDeerSVG() : fallowDeerSVG()}</button>`;
  li.querySelector("button").addEventListener("click", () => {
    if (quiz) return;
    if (spotted.has(i)) { flyTo(h.x, h.y); openDeer(i, false); }
    else showCard("🔍", "Still hiding!", `Clue: this one is in ${h.park}. Look for a glowing patch and zoom in close.`, []);
  });
  $("deerList").appendChild(li);
});
L.landmarks.forEach((m) => {
  const li = document.createElement("li"); li.dataset.name = m.name;
  li.innerHTML = `<button type="button"><span>${m.icon}</span><span></span><span class="tick" aria-hidden="true"></span></button>`;
  li.querySelector("span:nth-child(2)").textContent = m.name;
  li.querySelector("button").addEventListener("click", () => { if (!quiz) { flyTo(m.x, m.y); visit(m); } });
  $("lmList").appendChild(li);
});
function refresh() {
  document.querySelectorAll("#deerList li").forEach((li) => {
    const i = +li.dataset.i, has = spotted.has(i);
    li.classList.toggle("got", has);
    li.querySelector("button").setAttribute("aria-label", has ? `${D.hidden[i].sp === "red" ? "Red" : "Fallow"} deer, spotted` : "Not spotted yet: tap for a clue");
  });
  deerEls.forEach((g, i) => { g.classList.toggle("found", spotted.has(i)); g.setAttribute("aria-label", spotted.has(i) ? "A deer you've spotted" : "Something is hiding here"); });
  document.querySelectorAll("#lmList li").forEach((li) => { const has = visited.has(li.dataset.name); li.classList.toggle("got", has); li.querySelector(".tick").textContent = has ? "✓" : ""; });
  document.querySelectorAll("#map .landmark").forEach((g) => g.classList.toggle("ticked", visited.has(g.dataset.name)));
  $("count").textContent = `${spotted.size} / ${D.hidden.length}`;
  $("barFill").style.width = `${spotted.size / D.hidden.length * 100}%`;
}
refresh();
$("restart").addEventListener("click", () => { spotted.clear(); visited.clear(); save(); refresh(); closeCard(); });
const book = $("book"), sheetBtn = $("sheetToggle");
sheetBtn.addEventListener("click", () => {
  const c = book.classList.toggle("collapsed"); sheetBtn.textContent = c ? "Show" : "Hide"; sheetBtn.setAttribute("aria-expanded", String(!c));
  if (c && region) setVB(fit(BOX[region]));
});
if (matchMedia("(max-width: 760px)").matches) { book.classList.add("collapsed"); sheetBtn.textContent = "Show"; sheetBtn.setAttribute("aria-expanded", "false"); }

// ------------------------------------------------------------ cards
function showCard(pic, title, fact, meta, yay) {
  $("cardPic").innerHTML = pic; $("cardName").textContent = title; $("cardFact").textContent = fact;
  $("cardYay").textContent = yay || ""; $("cardYay").hidden = !yay;
  $("cardMeta").innerHTML = meta.map((m) => `<span class="chipm">${m}</span>`).join("");
  $("card").hidden = false;
  if (matchMedia("(max-width: 760px)").matches) { book.classList.add("collapsed"); sheetBtn.textContent = "Show"; }
  $("cardClose").focus({ preventScroll: true });
}
function closeCard() { $("card").hidden = true; }
$("cardClose").addEventListener("click", closeCard);
addEventListener("keydown", (e) => { if (e.key === "Escape") closeCard(); });
function openDeer(i, fresh) {
  const h = D.hidden[i], red = h.sp === "red";
  const fact = FACTS[h.sp][i % FACTS[h.sp].length];
  showCard(red ? redDeerSVG() : fallowDeerSVG(), red ? "A red deer!" : "A fallow deer!", fact,
           [`📍 ${h.park}`, `👀 ${h.n} real sightings nearby`], fresh ? `You spotted it! ${spotted.size} of ${D.hidden.length}` : "In your notebook");
}
function spot(i) {
  const fresh = !spotted.has(i);
  if (fresh) { spotted.add(i); save(); refresh(); burst(spotted.size === D.hidden.length ? 260 : 60); }
  openDeer(i, fresh);
  if (fresh && spotted.size === D.hidden.length) showDone("Deer spotter badge!", "You found all 10 deer. Remember your promise: stay 50 metres away, never feed them, and keep dogs on a lead.", "Keep exploring");
}
function visit(m) {
  const fresh = !visited.has(m.name);
  if (fresh) { visited.add(m.name); save(); refresh(); burst(30); }
  showCard(m.icon, m.name, m.fact, [], fresh ? "Ticked off!" : "");
}
function flyTo(x, y) { leaveRegion(); animateTo(fit([x - 450, y - 300, 900, 600])); }
deerG.addEventListener("click", (e) => { if (dragged || quiz) return; const g = e.target.closest(".deer"); if (g) { tip.hidden = true; spot(+g.dataset.i); } });
deerG.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !quiz) { const g = e.target.closest(".deer"); if (g) { e.preventDefault(); spot(+g.dataset.i); } } });
svg.addEventListener("click", (e) => {
  if (dragged || quiz) return;
  const g = e.target.closest?.(".landmark"); if (!g) return;
  const m = L.landmarks.find((x) => x.name === g.dataset.name); if (m) visit(m);
});

// ------------------------------------------------------------ quiz
const Q = [
  { pic: () => redDeerSVG(), q: "Which deer is this?", opts: ["Red deer", "Fallow deer"], a: 0, why: "Red deer are big and reddish-brown, with branching antlers." },
  { pic: () => fallowDeerSVG(), q: "Which deer is this?", opts: ["Red deer", "Fallow deer"], a: 1, why: "Fallow deer have spots and flat antlers, like a hand." },
  { pic: () => "📏", q: "How far away should you stay from deer?", opts: ["5 metres", "20 metres", "At least 50 metres"], a: 2, why: "At least 50 metres: about four buses long." },
  { pic: () => fawnSVG(), q: "When are baby deer born?", opts: ["In winter", "May to July", "In September"], a: 1, why: "Babies are born from May to July and hide in the bracken." },
  { pic: () => "🦌", q: "What happens to a stag's antlers every year?", opts: ["They fall off and grow back", "They change colour", "Nothing, they stay the same"], a: 0, why: "They drop off in spring and grow back, bigger, by the autumn." },
  { pic: () => "🍂", q: "In autumn, red deer stags…", opts: ["roar", "sing", "climb trees"], a: 0, why: "Stags roar in autumn to show off. It's called the rut." },
  { pic: () => "🗺️", q: "Which park is bigger?", opts: ["Richmond Park", "Bushy Park"], a: 0, why: "Richmond Park is about twice the size of Bushy Park." },
  { pic: () => "🔥", q: "Tap a glowing patch where lots of deer have been seen.", tap: "hot", why: "The glowing patches show where people spot deer most." },
  { pic: () => "🦆", q: "Tap Pen Ponds on the map.", tap: "Pen Ponds", why: "Pen Ponds are the two big ponds in the middle of Richmond Park." },
];
function setMode(q) {
  $("modeExplore").setAttribute("aria-pressed", String(!q)); $("modeQuiz").setAttribute("aria-pressed", String(q));
  document.body.classList.toggle("quizzing", q);
  closeCard(); deerG.style.display = q ? "none" : "";
  if (q) {
    const pick = Q.slice(0, 7).sort(() => Math.random() - 0.5).slice(0, 5).concat(Q.slice(7));
    quiz = { qs: pick, i: 0, score: 0, tries: 0, tap: null }; $("quiz").hidden = false; ask();
    $("intro").textContent = "Answer the questions. Some ask you to tap the map.";
  } else { quiz = null; $("quiz").hidden = true; $("intro").textContent = "Ten deer are hiding where real deer are often seen. Look in the glowing patches and tap each one you spot."; }
  vbAnim = null; if (region) setVB(fit(BOX[region]));
}
function ask() {
  const q = quiz.qs[quiz.i]; quiz.tries = 0; quiz.tap = q.tap || null;
  $("quizPic").innerHTML = q.pic(); $("quizQ").textContent = q.q;
  $("quizHint").textContent = ""; $("quizHint").className = "hint"; $("quizOpts").replaceChildren();
  (q.opts || []).forEach((o, k) => {
    const b = document.createElement("button"); b.className = "btn small"; b.type = "button"; b.textContent = o;
    b.addEventListener("click", () => choose(k, b)); $("quizOpts").appendChild(b);
  });
  if (q.tap === "Pen Ponds") zoomTo("Both parks");
  $("quizNum").textContent = `Question ${quiz.i + 1} of ${quiz.qs.length}`; $("quizScore").textContent = `⭐ ${quiz.score}`;
}
function right(q) {
  quiz.score += quiz.tries === 0 ? 1 : 0; quiz.tap = null;
  $("quizHint").textContent = "Yes! " + q.why; $("quizHint").className = "hint good"; $("quizScore").textContent = `⭐ ${quiz.score}`;
  burst(40); setTimeout(next, 2300);
}
function wrong(text) { quiz.tries++; $("quizHint").textContent = text; $("quizHint").className = "hint bad"; }
function choose(k, b) {
  const q = quiz.qs[quiz.i]; if (q.tap || $("quizHint").classList.contains("good")) return;
  if (k === q.a) right(q); else { b.disabled = true; wrong("Not quite, try again!"); }
}
function ringAt(x, y, cls) { const r = vb[2] / svg.clientWidth * 18; const c = el("circle", { cx: x, cy: y, r, class: "tapring " + cls }, $("tapG")); setTimeout(() => c.remove(), 900); }
function mapTap(cx, cy) {
  const q = quiz.qs[quiz.i], r = svg.getBoundingClientRect(), upp = vb[2] / r.width;
  const x = vb[0] + (cx - r.left) * upp, y = vb[1] + (cy - r.top) * upp;
  let ok = false;
  if (q.tap === "hot") { const pt = svg.createSVGPoint(); pt.x = x; pt.y = y; ok = [...svg.querySelectorAll("path.hot")].some((p) => p.isPointInFill(pt)); }
  else { const m = L.landmarks.find((l) => l.name === q.tap); ok = m && Math.hypot(m.x - x, m.y - y) < 260; }
  ringAt(x, y, ok ? "good" : "bad");
  if (ok) right(q);
  else wrong(q.tap === "hot" ? "Not there! Look for a yellow or orange glow inside a park." : "Not there! Pen Ponds are in the middle of Richmond Park.");
}
$("modeExplore").addEventListener("click", () => setMode(false));
$("modeQuiz").addEventListener("click", () => setMode(true));
$("quizSkip").addEventListener("click", () => { if (quiz) { quiz.tap = null; next(); } });
function next() {
  quiz.i++;
  if (quiz.i >= quiz.qs.length) {
    const s = quiz.score, n = quiz.qs.length; burst(s >= n * 0.7 ? 220 : 60);
    showDone(s === n ? "Deer expert!" : s >= n * 0.7 ? "Brilliant!" : "Good try!", `You got ${s} out of ${n}. Now go and spot some real deer, from 50 metres away!`, "Play again");
    return;
  }
  ask();
}
function showDone(title, text, btn) { $("doneTitle").textContent = title; $("doneText").textContent = text; $("doneBtn").textContent = btn; $("done").hidden = false; $("doneBtn").focus({ preventScroll: true }); }
$("doneBtn").addEventListener("click", () => { $("done").hidden = true; if (quiz) setMode(true); });

// ------------------------------------------------------------ confetti (autumn leaves)
const cv = $("confetti"), cx2 = cv.getContext("2d");
const COLORS = ["#FFB547", "#FF9A3C", "#B5522A", "#A6DA6C", "#E2A13A", "#FFCE2E"];
let bits = [], raf = 0;
function burst(n) {
  if (reduce) return;
  for (let k = 0; k < n; k++) bits.push({ x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4,
    r: Math.random() * 6.3, s: 7 + Math.random() * 8, c: COLORS[k % COLORS.length], life: 150 });
  if (!raf) raf = requestAnimationFrame(drawConfetti);
}
function drawConfetti() {
  cv.width = innerWidth; cv.height = innerHeight;
  bits = bits.filter((b) => b.life-- > 0 && b.y < innerHeight + 40);
  for (const b of bits) {
    b.vy += .38; b.x += b.vx; b.y += b.vy; b.vx *= .98; b.r += .12;
    cx2.save(); cx2.translate(b.x, b.y); cx2.rotate(b.r); cx2.fillStyle = b.c; cx2.strokeStyle = "#2b2230"; cx2.lineWidth = 1;
    cx2.beginPath(); cx2.ellipse(0, 0, b.s / 2, b.s / 4, 0, 0, 7); cx2.fill(); cx2.stroke(); cx2.restore();   // leaf-shaped
  }
  raf = bits.length ? requestAnimationFrame(drawConfetti) : 0;
}
